.mc-zoom span{align-self:center;font-size:11.5px;color:var(--muted);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.mc-hint{position:absolute;left:12px;bottom:12px;font-size:11.5px;color:var(--muted);padding:5px 10px;border-radius:999px;background:var(--solid);border:1px solid var(--line);z-index:3}

/* inspector */
.mc-insp{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 100px);overflow:auto;padding:16px}
.mc-ih{display:flex;align-items:center;gap:10px}
.mc-ih .mc-ni{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2);flex:none}
.mc-ih .mc-ni svg{width:16px;height:16px}
.mc-ih.trig .mc-ni{background:linear-gradient(135deg,#FF6D29,#FF8A4F);color:#fff}
.mc-ih div{flex:1;min-width:0}
.mc-ih b{display:block;font-weight:500}
.mc-x{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);display:grid;place-items:center;flex:none;padding:0}
.mc-x:hover{color:var(--fg);border-color:var(--line-2)}
.mc-x svg{width:12px;height:12px}
.mc-x.del:hover{color:var(--bad);border-color:var(--bad)}
.mc-li{display:flex;gap:6px;align-items:center}
.mc-li .inp{flex:1}
.mc-add{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:6px 12px;border:1px dashed var(--line-2);border-radius:999px;background:none;color:var(--fg-2);font-size:12.5px}
.mc-add:hover{border-color:var(--accent);color:var(--fg)}
.mc-add svg{width:12px;height:12px}
.mc-add[disabled]{opacity:.45;cursor:not-allowed}
.mc-chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--fg-2);cursor:pointer}
.mc-chk input{width:16px;height:16px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.mc-note{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);padding:10px 12px;border-radius:14px;background:var(--sunk);border:1px solid var(--line)}
.mc-note svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--accent-2)}
.mc-note b{color:var(--fg-2);font-weight:500}
.mc-note.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.mc-note.warn svg{color:var(--warn)}
.mc-note.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.mc-note.bad svg{color:var(--bad)}
.mc-range{display:flex;align-items:center;gap:10px}
.mc-range input{flex:1;accent-color:var(--accent)}
.mc-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mc-checks{display:flex;flex-direction:column;gap:2px}
.mc-ck{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--fg-2)}
.mc-ck:last-child{border-bottom:0}
.mc-ck .mc-d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--good-bg);color:var(--good)}
.mc-ck.warn .mc-d{background:var(--warn-bg);color:var(--warn)}
.mc-ck .mc-d svg{width:12px;height:12px}
.mc-ck b{display:block;font-weight:500;color:var(--fg)}
.mc-sheetbar{display:none}

/* test modal */
.mc-ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,7,6,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mc-modal{display:flex;gap:22px;align-items:stretch;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px)}
.mc-tside{width:260px;display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:22px;border:1px solid var(--line);background:var(--solid);box-shadow:var(--shadow)}
.mc-tside h2{margin:0;font-weight:400;font-size:22px;letter-spacing:-.03em;line-height:1.15}
.mc-tside p{margin:0;font-size:12.5px;color:var(--muted)}
.mc-tstep{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);overflow:auto}
.mc-tstep span{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:10px}
.mc-tstep span.on{background:var(--accent-soft);color:var(--fg)}
.mc-tstep span.done{color:var(--fg-2)}
.mc-tstep svg{width:13px;height:13px;flex:none}
.mc-modal .gr-phone{width:330px;display:flex}
.mc-modal .gr-scr{flex:1;min-height:0;height:min(640px,calc(100dvh - 52px))}
.mc-modal .gr-thread{overflow-y:auto;scroll-behavior:smooth}
.mc-modal .gr-thread>*,.mc-log>*{flex-shrink:0}
.mc-qrs{align-self:flex-end;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:94%}
.mc-qrs button{padding:5px 11px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);background:var(--surface);color:var(--accent-2);font-size:11.5px}
.mc-qrs button:hover,.mc-qrs button:focus-visible{background:var(--accent-soft);color:var(--fg)}
.mc-bb{align-self:flex-end;display:flex;flex-direction:column;gap:4px;width:72%}
.mc-bb span{padding:6px 10px;border-radius:12px;border:1px solid var(--line-2);text-align:center;font-size:11.5px;background:var(--surface)}
.mc-typing{align-self:flex-end;padding:8px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.mc-tclose{position:absolute;top:16px;right:16px}

/* live chat */
.mc-chat{display:grid;grid-template-columns:300px minmax(0,1fr) 290px;gap:16px;align-items:stretch;height:min(720px,calc(100vh - 120px));min-height:560px}
.mc-chat>.card{padding:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.mc-clh{display:flex;flex-direction:column;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.mc-clh .chips{border-radius:18px}
.mc-clh .chips::-webkit-scrollbar{display:none}
.mc-clh .chips button{white-space:nowrap;padding:5px 10px;font-size:12.5px}
.mc-cls{flex:1;overflow-y:auto;padding:6px}
.mc-ci{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;width:100%;padding:10px;border:0;border-radius:14px;background:none;text-align:left;align-items:start}
.mc-ci:hover{background:var(--sunk)}
.mc-ci[aria-current="true"]{background:var(--accent-soft)}
.mc-ci .av{width:36px;height:36px;font-size:12px}
.mc-ci .mc-cit{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.mc-ci b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-ci .mc-prev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mc-ci.unread .mc-prev{color:var(--fg)}
.mc-ci .mc-cim{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.mc-ci .tag{font-size:10.5px;padding:1px 7px}
.mc-un{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);display:inline-block;flex:none}
.mc-cmh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mc-cmh .av{width:36px;height:36px}
.mc-cmh .mc-who{flex:1;min-width:140px}
.mc-cmh .mc-who b{display:block;font-weight:500;line-height:1.25}
.mc-cmh .btn{padding:6px 12px;font-size:12.5px}
.mc-back{display:none}
.mc-win{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap}
.mc-win svg{width:12px;height:12px}
.mc-win.ok{color:var(--good);background:var(--good-bg)}
.mc-win.ha{color:var(--warn);background:var(--warn-bg)}
.mc-win.off{color:var(--bad);background:var(--bad-bg)}
.mc-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:0}
.mc-bub{max-width:min(78%,520px);padding:9px 13px;border-radius:18px;font-size:13.5px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.mc-bub.in{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.mc-bub.bot,.mc-bub.me{align-self:flex-end;border-bottom-right-radius:6px}
.mc-bub.bot{background:var(--sunk);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.mc-bub.me{background:linear-gradient(135deg,#FF6D29,#FF8A4F);color:#fff}
.mc-by{font-size:10.5px;color:var(--muted);margin-top:-4px}
.mc-by.r{align-self:flex-end}
.mc-sys{align-self:center;text-align:center;font-size:11px;color:var(--muted);padding:3px 10px;border-radius:999px;border:1px solid var(--line);max-width:92%}
.mc-cf{border-top:1px solid var(--line);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.mc-qr2{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.mc-qr2::-webkit-scrollbar{display:none}
.mc-qr2 button{flex:none;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);font-size:12px;color:var(--fg-2);white-space:nowrap}
.mc-qr2 button:hover{border-color:var(--accent);color:var(--fg)}
.mc-qr2 button.ai{border-color:color-mix(in srgb,var(--accent) 50%,transparent);color:var(--accent-2);display:inline-flex;gap:6px;align-items:center}
.mc-qr2 button.ai svg{width:12px;height:12px}
.mc-cmp{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 14px;border:1px solid var(--line-2);border-radius:999px;background:var(--sunk)}
.mc-cmp input{flex:1;min-width:0;border:0;background:none;outline:none;padding:6px 0}
.mc-cmp .btn{padding:7px 14px}
.mc-cmp.dis{opacity:.55}
.mc-side{overflow-y:auto!important}
.mc-sd{padding:16px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line)}
.mc-sd:last-child{border-bottom:0}
.mc-sd h4{margin:0;font-size:12px;font-weight:500;color:var(--muted)}
.mc-prof{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.mc-prof .av{width:56px;height:56px;font-size:18px}
.mc-prof b{font-weight:500;font-size:15px}
.mc-tags{display:flex;flex-wrap:wrap;gap:5px}
.mc-tags .tag{gap:4px}
.mc-tags .tag button{border:0;background:none;padding:0;color:inherit;opacity:.6;display:grid;place-items:center}
.mc-tags .tag button:hover{opacity:1}
.mc-tags .tag button svg{width:9px;height:9px}
.mc-kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 12px;font-size:12.5px;margin:0}
.mc-kv dt{color:var(--muted)}
.mc-kv dd{margin:0;text-align:right;color:var(--fg-2);overflow-wrap:anywhere}
.mc-score{display:flex;align-items:center;gap:10px}
.mc-score b{font-size:24px;font-weight:400;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.mc-score .bar{flex:1;height:6px;margin:0}
.mc-score .bar i{background:linear-gradient(90deg,#FF6D29,#FF8A4F)}
.mc-empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}

/* contacts */
.mc-ctbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mc-srch{display:flex;align-items:center;gap:8px;flex:1;min-width:220px;max-width:360px;padding:0 12px;border:1px solid var(--line-2);border-radius:999px;background:var(--sunk)}
.mc-srch svg{width:14px;height:14px;color:var(--muted);flex:none}
.mc-srch input{flex:1;min-width:0;border:0;background:none;outline:none;padding:9px 0}
.mc-segb{display:flex;flex-direction:column;gap:10px}
.mc-cond{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,.8fr) minmax(0,1.2fr) 30px;gap:8px;align-items:center}
.mc-cond .mc-and{font-size:11.5px;color:var(--muted);text-align:right}
.mc-cond .inp{padding:7px 10px}
.mc-bulk{position:sticky;top:72px;z-index:4;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:18px;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);background:linear-gradient(120deg,var(--accent-soft),transparent 70%),var(--solid);box-shadow:var(--shadow)}
.mc-bulk b{font-weight:500}
.mc-bulk .btn{padding:6px 12px;font-size:12.5px}
.mc-ctt td,.mc-ctt th{white-space:nowrap}
.mc-ctt td.wrap{white-space:normal;min-width:150px}
.mc-ctt input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0;vertical-align:middle}
.mc-ctt tr.sel td{background:var(--accent-soft)}
.mc-ctt .mc-cn{display:flex;align-items:center;gap:10px}
.mc-ctt .mc-cn .av{width:30px;height:30px;font-size:11px}
.mc-ctt .mc-cn b{display:block;font-weight:500}
.mc-ctt .tag{font-size:11px}
.mc-24{display:inline-flex;align-items:center;gap:5px;font-size:11.5px}
.mc-24 i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.mc-24.no{color:var(--muted)}
.mc-24.no i{background:var(--faint)}
.mc-res{display:flex;gap:10px;align-items:flex-start}

/* growth tools */
.mc-gtg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mc-gt{display:flex;flex-direction:column;gap:14px}
.mc-gth{display:flex;gap:12px;align-items:flex-start}
.mc-gth .mc-gi{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--line)}
.mc-gth .mc-gi svg{width:18px;height:18px}
.mc-gth div{flex:1;min-width:0}
.mc-gth b{display:block;font-weight:500;font-size:15px}
.mc-gth p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.mc-gst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mc-gst div{padding:9px 11px;border-radius:14px;background:var(--sunk);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.mc-gst b{font-weight:500;font-size:17px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mc-gst span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-gt.off .mc-gst{opacity:.6}
.mc-gt>.btn{align-self:flex-start}
.mc-gt.soon{opacity:.72}
.mc-qrw{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:center}
.mc-qr{width:132px;height:132px;padding:10px;border-radius:16px;background:#fff;box-shadow:0 10px 30px -16px var(--accent)}
.mc-qr svg{width:100%;height:100%;display:block}
.mc-link{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border:1px solid var(--line-2);border-radius:999px;background:var(--sunk);min-width:0}
.mc-link code{flex:1;min-width:0;font-family:var(--f-ui);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-link .btn{padding:6px 12px;font-size:12.5px}
.mc-code{margin:0;padding:10px 12px;border-radius:14px;background:var(--sunk);border:1px solid var(--line);font-size:11.5px;color:var(--fg-2);white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.mc-wid{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;border:1px dashed var(--line-2);background:var(--sunk)}
.mc-wid span.mc-wb{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:linear-gradient(135deg,#FF6D29,#FF8A4F);color:#fff;font-size:12.5px;font-weight:500}

/* templates */
.mc-tplg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mc-tpl{display:flex;flex-direction:column;gap:12px}
.mc-tpl .mc-tv{display:flex;flex-direction:column;gap:0;padding:12px;border-radius:16px;background:var(--sunk);border:1px solid var(--line);background-image:radial-gradient(color-mix(in srgb,var(--fg) 10%,transparent) 1px,transparent 1.2px);background-size:16px 16px}
.mc-tv span{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2);padding:5px 8px;border-radius:10px;background:var(--solid);border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-tv span svg{width:12px;height:12px;flex:none;color:var(--accent-2)}
.mc-tv span.t{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.mc-tv i{display:block;width:1.5px;height:9px;margin-left:15px;background:var(--line-2)}
.mc-tpl p{margin:0;font-size:12.5px;color:var(--muted)}
.mc-tpl .mc-tf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}

/* responsive */
@media (max-width:1600px){
  .mc-flows{grid-template-columns:minmax(0,1fr) 300px}
  .mc-fl{grid-column:1/-1}
  .mc-fls{flex-direction:row;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .mc-fi{min-width:230px;max-width:250px;flex:none}
}
@media (min-width:1361px){.mc-cmh [data-mc-info]{display:none}}
@media (max-width:1360px){
  .mc-chat{grid-template-columns:280px minmax(0,1fr)}
  .mc-chat>.mc-side{display:none}
  .mc-chat.info>.mc-side{display:flex;position:fixed;right:16px;top:84px;bottom:16px;width:300px;z-index:20;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);background:var(--solid)}
  .mc-tplg{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1100px){
  .mc-ovg{grid-template-columns:1fr}
}
@media (max-width:980px){
  .mc-flows{grid-template-columns:minmax(0,1fr)}
  .mc-insp{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;max-height:64vh;max-height:64dvh;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--solid);box-shadow:0 -24px 60px -12px rgba(0,0,0,.6);animation:mcUp .18s ease-out}
  .mc-flows:not(.has-sel) .mc-insp{display:none}
  .mc-sheetbar{display:block;width:44px;height:5px;border-radius:999px;background:var(--line-2);margin:0 auto 2px;flex:none}
  .mc-modal .mc-tside{display:none}
}
@keyframes mcUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (max-width:860px){
  .mc-chat{grid-template-columns:minmax(0,1fr);height:auto;min-height:0}
  .mc-chat>.card{display:none}
  .mc-chat[data-pane="list"]>.mc-cl,.mc-chat[data-pane="chat"]>.mc-cm{display:flex}
  .mc-chat.info:not([data-pane="info"])>.mc-side{display:none}
  .mc-chat[data-pane="info"]>.mc-side{display:flex;position:static;width:auto;box-shadow:var(--shadow);background:var(--surface)}
  .mc-chat>.mc-cl{max-height:none}
  .mc-cls{max-height:none}
  .mc-chat>.mc-cm{height:calc(100dvh - 150px);min-height:480px}
  .mc-back{display:grid}
  .mc-gtg{grid-template-columns:1fr}
  .mc-cv{height:62vh;min-height:420px}
  .mc-cond{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 30px}
  .mc-cond .mc-and{display:none}
  .mc-cond .mc-cf1{grid-column:1/3}
  .mc-cond .mc-x{grid-row:1;grid-column:3}
}
@media (max-width:640px){
  .mc-tplg{grid-template-columns:1fr}
  .mc-rules{grid-template-columns:1fr}
  .mc-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mc-bar .mc-name{flex-basis:100%}
  .mc-qrw{grid-template-columns:1fr;justify-items:start}
  .mc-hint{display:none}
  .mc-stl{display:none}
  .mc-cmh{gap:8px}
  .mc-cmh .mc-who{min-width:0;flex:1 1 calc(100% - 100px)}
  .mc-cmh .mc-who span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc-cmh .mc-win{margin-left:46px}
  .mc-hs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%;flex:1 1 100%}
  .mc-hs::-webkit-scrollbar{display:none}
  .mc-hs button{white-space:nowrap;flex:none}
  .mc-ctbar .btn{flex:1;justify-content:center;white-space:nowrap;padding:9px 12px}
  .mc-bulk{top:60px}
  .mc-srch{max-width:none}
  .mc-modal .gr-phone{width:min(330px,calc(100vw - 32px))}
  .mc-g2{grid-template-columns:1fr}
}

/* ===== ext-tasks: Aufgaben (Team-Task-Manager) ===== */
.tk-vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.tk-sm{font-size:12px}
.tk-nw{white-space:nowrap}
.tk-ell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-bad{color:var(--bad)} .tk-warn{color:var(--warn)} .tk-good{color:var(--good)}
.tk-row-g{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tk-h3i{display:inline-flex;align-items:center;gap:8px}
.tk-h3i svg{width:16px;height:16px;color:var(--accent)}
.tk-p{margin:0 0 14px}

/* header */
.tk-phact{display:flex;gap:8px;flex-wrap:wrap}
.tk-phact .btn svg{width:15px;height:15px}
.tk-kpi .v{font-size:30px}
.tk-kpi.is-bad .v{color:var(--bad)}
.tk-kpi.is-good .v{color:var(--good)}

/* avatars */
.tk-av{width:24px;height:24px;font-size:9.5px;letter-spacing:.02em}
.tk-av-ED{background:var(--accent-soft);color:var(--accent-2);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.tk-av-ST{background:var(--good-bg);color:var(--good);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 40%,transparent)}
.tk-av-CM{background:var(--sunk);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.tk-av-KL{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2);outline:1px dashed var(--line-2);outline-offset:-1px}
.tk-av-auto{background:var(--accent-soft);color:var(--accent)}
.tk-av-auto svg{width:13px;height:13px}
.tk-avs{display:inline-flex;align-items:center;flex:none}
.tk-avs .tk-av{border:2px solid var(--bg);width:26px;height:26px}
.tk-avs .tk-av+.tk-av{margin-left:-8px}
.tk-none-who{color:var(--faint)}

/* flags, status, due */
.tk-flag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--fg-2);white-space:nowrap}
.tk-flag svg{width:15px;height:15px;flex:none}
.tk-p-urg svg{color:var(--bad)}
.tk-p-high svg{color:var(--accent)}
.tk-p-norm svg{color:var(--accent-2);opacity:.55}
.tk-p-low svg{color:var(--faint)}
.tk-st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;white-space:nowrap}
.tk-st i{width:9px;height:9px;border-radius:50%;flex:none;border:2px solid var(--muted)}
.tk-s-prog .tk-st i,.tk-st.tk-s-prog i{border-color:var(--accent);background:var(--accent)}
.tk-st.tk-s-rev i{border-color:var(--warn);background:var(--warn-bg)}
.tk-st.tk-s-done i{border-color:var(--good);background:var(--good)}
.tk-st.tk-s-open i{border-color:var(--muted)}
.tk-due{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg-2);white-space:nowrap}
.tk-due svg{width:14px;height:14px;flex:none;opacity:.7}
.tk-due.tk-bad{color:var(--bad)} .tk-due.tk-warn{color:var(--warn)}
.tk-mi{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.tk-mi svg{width:13px;height:13px}
.tk-mi-sh{color:var(--accent-2)}
.tk-tg{font-size:12px;color:var(--faint)}

/* custom select wrapper */
.tk-selw{position:relative;display:inline-flex;align-items:center;min-width:0}
.tk-selw .tk-sel{appearance:none;-webkit-appearance:none;width:100%;padding:6px 30px 6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--sunk);font-size:12.5px;color:var(--fg);cursor:pointer;text-overflow:ellipsis}
.tk-selw .tk-sel:hover{border-color:var(--line-2)}
.tk-selw>svg{position:absolute;right:10px;width:13px;height:13px;pointer-events:none;color:var(--muted)}
.tk-selw.tk-s-prog .tk-sel{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.tk-selw.tk-s-rev .tk-sel{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tk-selw.tk-s-done .tk-sel{background:var(--good-bg);color:var(--good);border-color:transparent}
.tk-sel option{background:var(--solid);color:var(--fg)}

/* toolbar */
.tk-tools{display:flex;flex-direction:column;gap:12px;padding:14px}
.tk-trow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.tk-hs{min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tk-hs::-webkit-scrollbar{display:none}
.tk-hs .chips{flex-wrap:nowrap;width:max-content}
.tk-hs .chips button{white-space:nowrap}
.tk-tog{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 5px;border:1px solid var(--line);border-radius:999px;background:var(--sunk);font-size:13px;color:var(--fg-2);white-space:nowrap}
.tk-tog svg{width:15px;height:15px;margin-left:5px}
.tk-tog .tk-av{width:22px;height:22px;font-size:8.5px}
.tk-tog:hover{border-color:var(--line-2)}
.tk-tog[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--fg);font-weight:500}
.tk-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto;min-width:0}
.tk-srch{display:flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--sunk);min-width:0;width:220px}
.tk-srch:focus-within{border-color:var(--accent)}
.tk-srch svg{width:14px;height:14px;color:var(--muted);flex:none}
.tk-srch input{border:0;background:none;outline:none;min-width:0;flex:1;font-size:13px;padding:1px 0}
.tk-filters .tk-selw{max-width:190px}
.tk-reset{padding:6px 14px}
.tk-clientbar{border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.tk-clientbar .ic svg{color:var(--accent)}

/* quick add */
.tk-qa{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 10px 10px 16px}
.tk-qa-t{flex:1 1 280px;display:flex;align-items:center;gap:10px;min-width:0}
.tk-qa-t svg{width:16px;height:16px;color:var(--accent);flex:none}
.tk-qa-t input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14px;padding:6px 0}
.tk-qa-t input[aria-invalid="true"]::placeholder{color:var(--bad)}
.tk-qa:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.tk-qa-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tk-qa-f .tk-selw{max-width:180px}
.tk-qa-d{width:auto;padding:5px 10px;border-radius:999px;font-size:12.5px;border-color:var(--line)}
.tk-err{flex-basis:100%;margin:0;color:var(--bad);font-size:12.5px}

/* list view */
.tk-listcard{padding:6px 8px 8px}
.tk-lhead,.tk-row{display:grid;grid-template-columns:30px minmax(0,1fr) 92px 128px 110px 128px;gap:12px;align-items:center}
.tk-lhead{padding:8px 10px 4px;font-size:11.5px;color:var(--muted);font-weight:500}
.tk-grp{border-top:1px solid var(--line)}
.tk-grp:first-of-type{border-top:0}
.tk-gh{display:flex;align-items:center;gap:10px;width:100%;padding:12px 10px 8px;border:0;background:none;text-align:left;border-radius:10px}
.tk-gh:hover{background:var(--sunk)}
.tk-gh-c{display:grid;place-items:center;width:18px;height:18px;color:var(--muted);transition:transform .15s}
.tk-gh-c svg{width:14px;height:14px}
.tk-gh-c.is-col{transform:rotate(-90deg)}
.tk-row{padding:9px 10px;border-radius:12px;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.tk-gh+.tk-row{border-top-color:transparent}
.tk-row:hover{background:var(--sunk)}
.tk-row.is-done .tk-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.tk-chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);background:none;display:grid;place-items:center;padding:0;color:transparent}
.tk-chk svg{width:12px;height:12px}
.tk-chk:hover{border-color:var(--good);color:var(--good)}
.tk-chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--bg)}
.tk-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.tk-title{border:0;background:none;padding:0;text-align:left;font-weight:500;line-height:1.35;color:var(--fg);overflow-wrap:anywhere}
.tk-title:hover{color:var(--accent-2)}
.tk-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tk-c-st .tk-selw{width:100%}
.tk-rf{display:contents}
.tk-none{padding:6px 10px 12px 52px;color:var(--faint);font-size:12.5px}

/* board */
.tk-board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(264px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;overscroll-behavior-x:contain}
.tk-col{background:var(--sunk);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:320px;transition:border-color .12s,background .12s;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.tk-col.over{border-color:var(--accent);border-style:dashed;background:var(--accent-soft)}
.tk-colh{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 6px}
.tk-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:9px;cursor:grab;box-shadow:var(--shadow)}
.tk-card:hover{border-color:var(--line-2)}
.tk-card:active{cursor:grabbing}
.tk-card.is-drag{opacity:.4}
.tk-card.is-done .tk-title{color:var(--muted);text-decoration:line-through}
.tk-cardtop{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tk-cardft{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tk-cardft .tk-avs{margin-left:auto}
.tk-meta-s{gap:7px}
.tk-prog{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.tk-prog i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#FF6D29,#FF8A4F)}
.tk-coladd{border:1px dashed var(--line);background:none;border-radius:12px;padding:8px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px;margin-top:auto}
.tk-coladd svg{width:14px;height:14px}
.tk-coladd:hover{color:var(--fg);border-color:var(--line-2)}
.tk-drop{border:1px dashed var(--line);border-radius:12px;padding:22px 10px;text-align:center;color:var(--faint);font-size:12.5px}
.tk-hint{margin:0;font-size:12.5px}

/* calendar */
.tk-calcard{padding:16px}
.tk-wknav{display:flex;align-items:center;gap:12px}
.tk-wknav h3{font-size:15px}
.tk-calcard .btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tk-ovstrip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px;margin-bottom:12px;border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:14px;background:var(--bad-bg)}
.tk-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tk-day{display:flex;flex-direction:column;gap:6px;padding:8px;min-height:220px;border-right:1px solid var(--line);min-width:0}
.tk-day:last-child{border-right:0}
.tk-day.is-we{background:var(--sunk)}
.tk-day.is-today{background:var(--accent-soft)}
.tk-dh{display:flex;align-items:baseline;gap:5px;padding:2px 2px 6px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.tk-dh b{font-size:17px;font-weight:400;color:var(--fg);letter-spacing:-.02em}
.tk-day.is-today .tk-dh b{color:var(--accent)}
.tk-dc{margin-left:auto;font-size:11px;padding:0 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--fg-2)}
.tk-evs{display:flex;flex-direction:column;gap:6px}
.tk-ev{display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12px;line-height:1.3;border-left:3px solid var(--muted)}
.tk-ev:hover{border-color:var(--line-2)}
.tk-ev-t{display:flex;gap:5px;align-items:flex-start}
.tk-ev-t>span:last-child{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tk-ev-t .tk-flag svg{width:12px;height:12px;margin-top:1px}
.tk-ev-m{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px}
.tk-ev-m .tk-avs{margin-left:auto}
.tk-ev-m .tk-avs .tk-av{width:20px;height:20px;font-size:8px;border-width:1.5px}
.tk-ev-prog{border-left-color:var(--accent)}
.tk-ev-rev{border-left-color:var(--warn)}
.tk-ev-done{border-left-color:var(--good);opacity:.65}
.tk-ev-done .tk-ev-t>span:last-child{text-decoration:line-through}
.tk-ovstrip .tk-ev{width:auto;max-width:260px;border-left-color:var(--bad);display:inline-flex}
.tk-ovstrip .tk-ev span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-free{font-size:11.5px;color:var(--faint);padding:2px}

/* team */
.tk-team{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tk-person{display:flex;flex-direction:column;gap:14px}
.tk-ph{display:flex;align-items:center;gap:12px}
.tk-ph .tk-av{width:42px;height:42px;font-size:13px}
.tk-ph b{font-weight:500}
.tk-ph .tag{margin-left:auto}
.tk-pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tk-pstats div{display:flex;flex-direction:column;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.tk-pstats b{font-size:20px;font-weight:400;letter-spacing:-.03em}
.tk-pstats span{font-size:11.5px;color:var(--muted)}
.tk-cap{display:flex;flex-direction:column;gap:6px}
.tk-caprow{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.tk-caprow b{font-weight:500}
.tk-capbar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.tk-capbar i{display:block;height:100%;border-radius:8px}
.tk-cap-good i{background:var(--good)}
.tk-cap-warn i{background:linear-gradient(90deg,#FF6D29,#FF8A4F)}
.tk-cap-bad i{background:var(--bad)}
.tk-capinfo{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--fg-2);padding:8px 10px;border:1px dashed var(--line-2);border-radius:12px}
.tk-capinfo svg{width:15px;height:15px;color:var(--accent);flex:none}
.tk-pnext{display:flex;flex-direction:column;gap:2px}
.tk-pnext button{display:flex;justify-content:space-between;gap:10px;align-items:center;border:0;background:none;padding:6px 8px;border-radius:10px;text-align:left;font-size:13px}
.tk-pnext button:hover{background:var(--sunk)}
.tk-pnext button>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-person>.btn{align-self:flex-start;margin-top:auto}

/* panels */
.tk-panel{border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.tk-dtform{display:grid;grid-template-columns:150px minmax(0,1fr) 90px minmax(0,1.4fr);gap:12px}
.tk-dtprev{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;counter-reset:x}
.tk-dtprev li{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--sunk);position:relative;min-width:0}
.tk-dtprev b{font-weight:500;font-size:13px;line-height:1.3}
.tk-dtn{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:linear-gradient(135deg,#FF6D29,#FF8A4F);color:var(--on-accent)}
.tk-pact{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.tk-note{min-height:150px;font-size:13px;line-height:1.55}
.tk-noteout{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.tk-nrow{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);cursor:pointer}
.tk-nrow input{width:17px;height:17px;accent-color:var(--accent);flex:none}
.tk-nrow-t{flex:1;min-width:0;display:flex;flex-direction:column}
.tk-nrow-t b{font-weight:500}

/* automations + feed */
.tk-rules{display:flex;flex-direction:column}
.tk-rule{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.tk-rule:first-child{border-top:0;padding-top:0}
.tk-rule.is-off .tk-rule-t{opacity:.55}

function metrics(){
  const b=B(),tf=TF.find(t=>t.k===S.tf),seed=S.brand*97+tf.n;
  const mult=tf.wk?7:1;
  const views=series(tf.n*2,4200*b.scale*mult,tf.wk?.012:.004,.35,seed+1);
  const fol=series(tf.n*2,38*b.scale*mult,tf.wk?.01:.003,.5,seed+2);
  const visits=series(tf.n*2,260*b.scale*mult,.004,.4,seed+3);
  const pd=tf.wk?5:.7,posts=Array.from({length:tf.n*2},(_,i)=>i<tf.n?pd*.85:pd);
  const cur=a=>a.slice(tf.n),prev=a=>a.slice(0,tf.n),sum=a=>a.reduce((x,y)=>x+y,0);
  const mk=(a)=>({cur:sum(cur(a)),prev:sum(prev(a)),s:cur(a)});
  const eng=4.1+S.brand*.6;
  return {tf,views:mk(views),fol:mk(fol),visits:mk(visits),posts:mk(posts),eng};
}

function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200)}
function spend(n,what){S.credits=Math.max(0,S.credits-n);document.getElementById('creditTxt').textContent=fmt(S.credits)+' / 2.000';document.getElementById('creditBar').style.width=(S.credits/20)+'%';if(what)toast(`${what} · ${n} Credits`)}
function sparkline(a,w=160,h=34){const mx=Math.max(...a),mn=Math.min(...a);const pts=a.map((v,i)=>[i/(a.length-1)*w,h-3-((v-mn)/(mx-mn||1))*(h-8)]);const d='M'+pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join('L');const last=pts[pts.length-1];return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${w},${h}L0,${h}Z" fill="var(--chart-fill)"/><path d="${d}" fill="none" stroke="var(--chart)" stroke-width="1.5" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="var(--chart)"/></svg>`}
function lineChart(a,b,labels){
  const W=760,H=240,L=48,R=12,T=14,Bm=28;const mx=Math.max(...a,...b)*1.1;
  const nice=(v)=>{const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=2?2:n<=5?5:10)*p};const top=nice(mx);
  const x=i=>L+i/(a.length-1)*(W-L-R),y=v=>T+(1-v/top)*(H-T-Bm);
  let g='';for(let i=0;i<=4;i++){const v=top*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+3}" text-anchor="end">${kfmt(v)}</text>`}
  const path=s=>'M'+s.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join('L');
  const step=Math.ceil(labels.length/6);let xl='';labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)xl+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Views im Zeitraum, aktuell gegen Vorperiode">${g}<path d="${path(b)}" fill="none" stroke="var(--chart-2)" stroke-width="1.4" stroke-dasharray="4 4"/><path d="${path(a)}L${x(a.length-1)},${y(0)}L${x(0)},${y(0)}Z" fill="var(--chart-fill)"/><path d="${path(a)}" fill="none" stroke="var(--chart)" stroke-width="2"/><circle cx="${x(a.length-1)}" cy="${y(a[a.length-1])}" r="4" fill="var(--chart)"/>${xl}</svg>`;
}
function labelsFor(tf){const now=new Date(2026,9,4);const out=[];for(let i=tf.n-1;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i*(tf.wk?7:1));out.push(d.getDate()+'.'+(d.getMonth()+1)+'.')}return out}

function bindKanban(){

  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');const c=S.cards.find(x=>x.id===drag);if(c&&c.c!==col.dataset.col){c.c=col.dataset.col;render();toast(`Verschoben nach „${col.dataset.col}“`)}});
  });
}
function think(cb,ms=900){const p=document.getElementById('page');p.style.opacity=.6;setTimeout(()=>{p.style.opacity='';cb()},ms)}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go]');if(!t)return;
  if(t.dataset.v)return go(t.dataset.v);
  if(t.dataset.go)return go(t.dataset.go);
  if(t.dataset.tf){S.tf=t.dataset.tf;return render()}
  if(t.dataset.ct){S.contentTab=t.dataset.ct;return render()}
  if(t.dataset.lt){S.libTab=t.dataset.lt;return render()}
  if(t.dataset.slide){S.storyIdx=+t.dataset.slide;return render()}
  if(t.dataset.kit){S.kit=+t.dataset.kit;return render()}
  if(t.dataset.lay){const s=S.seq[S.storyIdx];s.lay=t.dataset.lay;if(s.lay==='list'&&!s.items)s.items=['Punkt eins','Punkt zwei','Punkt drei'];if(s.lay==='proof'&&!s.num){s.num='148';s.p=s.p||'Closings im Monat';}if(s.lay==='poll'&&!s.opts)s.opts=['Ja','Nein'];if(s.lay==='cta'&&!s.cta)s.cta='Nachricht senden';if(!s.h&&s.lay!=='proof')s.h='Neue <em>Headline</em>';return render()}
  if(t.dataset.proof){const p=PROOFS[+t.dataset.proof];const s=S.seq[S.storyIdx];const m=p.t.match(/[\d.,]+\s*(Mio\.)?(\s*→\s*[\d.,]+)?/);s.num=m?m[0].trim():p.t;s.p=p.t;p.used++;p.last=0;render();return toast('Proof eingefügt · Nutzung gezählt')}
  if(t.dataset.task!==undefined)return;
  if(t.dataset.script!==undefined){S.scriptFor=S.ideas[+t.dataset.script];S.contentTab='script';return render()}
  if(t.dataset.pipe!==undefined){const x=S.ideas[+t.dataset.pipe];S.cards.push({id:Date.now(),t:x.t,c:'Idee',p:'IG',who:'AM'});return toast('In die Pipeline gelegt')}
  if(t.dataset.adapt!==undefined){S.storyType='Social Proof';S.seq=makeSequence('Social Proof');S.storyIdx=0;spend(5);go('stories');return toast('Sequenz nach Inspiration erstellt · 5 Credits')}
  if(t.dataset.ask){return ask(t.dataset.ask)}
  if(t.dataset.toast)return toast(t.dataset.toast);
  switch(t.id){
    case 'genIdeas':think(()=>{S.ideas=[{t:'Was Coaches von Trading-Charts über Content lernen können',pil:'Positionierung',why:'Neue Kombination aus deinen 2 stärksten Themen',f:'Reel'},{t:'Mein schlechtestes Video und was ich daraus gelernt habe',pil:'Founder-Story',why:'Ehrliche Formate holen bei dir die meisten Kommentare',f:'Talking Head'},{t:'Die 3 Zahlen, die ich jeden Montag anschaue',pil:'Lead-Funnel',why:'Educational + Zahl-Hook, beides über Schnitt',f:'Karussell'},...S.ideas].slice(0,10);spend(5,'5 Ideen erstellt');render()});break;
    case 'genScript':think(()=>{const i=+document.getElementById('scIdea').value;S.scriptFor=S.ideas[i];spend(3,'Skript erstellt');render()});break;
    case 'genSeq':think(()=>{S.storyType=document.getElementById('stType').value;S.seq=makeSequence(S.storyType);S.storyIdx=0;spend(5,'Sequenz erstellt');render()},1100);break;
    case 'prevSl':S.storyIdx--;render();break;
    case 'nextSl':S.storyIdx++;render();break;
    case 'exportSt':toast('Export: 6 PNGs in 1080 × 1920 (in der Demo deaktiviert)');break;
    case 'addMonth':toast('Formular „Oktober eintragen“ öffnet sich (Demo)');break;
    case 'brandBtn':openBrandMenu(t);break;
    case 'searchBtn':openCmd();break;
    case 'themeBtn':{const r=document.documentElement;const dark=r.dataset.theme!=='light';r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('bos-theme',r.dataset.theme)}catch(e){}render();break}
    case 'notifBtn':openNotif(t);break;
    case 'burger':document.getElementById('side').classList.toggle('open');break;
  }
});

const INDEX=[...POSTS.map(p=>({g:'Videos',t:p.t,v:'perf'})),...CARDS0.map(c=>({g:'Pipeline',t:c.t,v:'content'})),...IDEAS0.map(c=>({g:'Ideen',t:c.t,v:'content'})),...PROOFS.map(p=>({g:'Social Proof',t:p.t,v:'lib'})),...INSP.map(p=>({g:'Inspiration',t:p.t,v:'lib'})),...NAV.filter(n=>n.k).map(n=>({g:'Bereiche',t:n.l,v:n.k}))];

function openCmd(){const o=document.getElementById('cmdk');o.hidden=false;const i=document.getElementById('cmdIn');i.value='';renderCmd('');setTimeout(()=>i.focus(),10)}
function renderCmd(q){const r=q?INDEX.filter(x=>x.t.toLowerCase().includes(q.toLowerCase())):INDEX.filter(x=>x.g==='Bereiche'||x.g==='Videos').slice(0,10);cmdSel=Math.min(cmdSel,Math.max(0,r.length-1));const groups={};r.forEach((x,i)=>{(groups[x.g]=groups[x.g]||[]).push([x,i])});document.getElementById('cmdRes').innerHTML=r.length?Object.entries(groups).map(([g,a])=>`<div class="rg mono muted">${g}</div>${a.map(([x,i])=>`<button class="${i===cmdSel?'act':''}" data-cmd="${x.v}"><span>${esc(x.t)}</span><span class="mono muted">${g}</span></button>`).join('')}`).join(''):`<div class="empty">Nichts gefunden für „${esc(q)}“.</div>`;renderCmd.r=r}
document.getElementById('cmdIn').addEventListener('input',e=>{cmdSel=0;renderCmd(e.target.value)});
document.getElementById('cmdk').addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(b){document.getElementById('cmdk').hidden=true;go(b.dataset.cmd)}else if(e.target.id==='cmdk')document.getElementById('cmdk').hidden=true});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd()}
  const o=document.getElementById('cmdk');if(o.hidden)return;
  if(e.key==='Escape')o.hidden=true;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();cmdSel+=e.key==='ArrowDown'?1:-1;cmdSel=Math.max(0,cmdSel);renderCmd(document.getElementById('cmdIn').value)}
  if(e.key==='Enter'){const r=renderCmd.r||[];if(r[cmdSel]){o.hidden=true;go(r[cmdSel].v)}}
});

const ACC_RANK={creator:1,pro:2,agency:3,ent:4};
function accPrice(k,cyc){const p=accPlan(k);return cyc==='year'?p.y:p.m}
function accNextDate(){return S.acc.trial?S.acc.trialEnd:S.acc.cycle==='year'?'04.10.2027':'04.11.2026'}
function accIsUp(k,cyc){const A=S.acc;return ACC_RANK[k]>ACC_RANK[A.plan]||(k===A.plan&&cyc==='year'&&A.cycle==='month')}
function accChangeText(k,cyc){
  const A=S.acc,np=accPlan(k),op=accPlan(),up=accIsUp(k,cyc),newP=accPrice(k,cyc),per=cyc==='year'?'Jahr':'Monat';
  if(A.trial)return {up:true,due:0,html:`<p>Du bist in der Testphase – heute wird nichts berechnet. Der Wechsel gilt sofort; ab ${A.trialEnd} zahlst du <b>${eur(newP)}/${per}</b>.</p>`};
  if(up){
    const credit=accPrice(A.plan,A.cycle)*(A.cycle==='year'?334/365:30/31);
    const due=cyc==='year'&&A.cycle==='month'?Math.max(0,newP-credit):Math.max(0,(newP-accPrice(A.plan,A.cycle))*(A.cycle==='year'?334/365:30/31));
    const why=cyc==='year'&&A.cycle==='month'?`${eur(newP)} Jahrespreis abzüglich ${eur(credit)} Restguthaben aus deinem ${op.n}-Monatsabo`:`anteilig für die restlichen ${A.cycle==='year'?'334 von 365':'30 von 31'} Tagen (${eur(newP,0)} − ${eur(accPrice(A.plan,A.cycle),0)})`;
    const next=cyc==='year'?'04.10.2027':A.cycle==='year'?'04.10.2027':'04.11.2026';
    return {up:true,due,next,html:`<p>Heute fällig: <b class="num">${eur(due)}</b> – ${why}. Danach ${eur(newP)}/${per}, nächste Rechnung am ${next}.</p>${np.cr>op.cr?`<p>Die zusätzlichen ${fmt(np.cr-op.cr)} AI-Credits stehen sofort bereit.</p>`:''}`};
  }
  const lost=[];if(op.k==='agency'&&np.k!=='agency')lost.push('weitere Brands, Client-Freigaben, White-Label-Reports');if(ACC_RANK[op.k]>=2&&np.k==='creator')lost.push('Business Impact, DM Autopilot, Trend-Radar');
  const extra=np.k==='creator'?Object.keys(A.conns).filter(id=>!['instagram','tiktok'].includes(id)).length:0;
  const teamOver=np.team&&2>np.team;
  return {up:false,html:`<p>Der Wechsel gilt ab <b>${accNextDate()}</b>. Bis dahin behältst du alle ${op.n}-Funktionen, es wird nichts erstattet. Danach ${eur(newP)}/${per}.</p>${lost.length?`<p>Danach nicht mehr enthalten: ${lost.join('; ')}.</p>`:''}${extra?`<p>${extra} Verbindung${extra>1?'en':''} außer Instagram und TikTok ${extra>1?'werden':'wird'} pausiert.</p>`:''}${teamOver?`<p>Dein Team hat 2 Mitglieder, ${np.n} erlaubt ${np.team}. Ein Zugang wird deaktiviert.</p>`:''}`};
}

  return `<div class="ph"><div><h1>Abo & Rechnungen</h1><p>Plan, Nutzung und Rechnungen für den Workspace „Agentur Aid Muric“.</p></div><button class="btn" data-toast="Rechnungsadresse und USt-IdNr. bearbeiten (Demo)">Rechnungsdaten</button></div>

    <dl class="acc-dl" style="max-width:520px"><dt>${A.canceled?'Zugriff bis':'Nächste Rechnung'}</dt><dd class="num">${accNextDate()}${A.canceled?'':` · ${eur(disc)}`}</dd><dt>Enthalten</dt><dd>${fmt(p.cr)} Credits/Monat · ${p.brands} Brand${p.brands>1?'s':''}</dd>
     ${A.pendingDown?`<dt>Geplant</dt><dd>Wechsel zu ${accPlan(A.pendingDown.plan).n} am ${accNextDate()} · <button class="acc-link" data-acc-undodown>Rückgängig</button></dd>`:''}
     ${A.paused?`<dt>Pause</dt><dd>04.11.2026 bis 04.01.2027 · <button class="acc-link" data-acc-unpause>Aufheben</button></dd>`:''}</dl>

   <section class="card"><div class="hd"><h3>Zahlungsmethode</h3>${A.card?`<button class="btn" data-acc-addcard>Ändern</button>`:''}</div>

function accFocusSel(sel){setTimeout(()=>{const el=document.querySelector(sel);el&&el.focus()},20)}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-acc-menu],[data-acc-nav],[data-acc-logout],[data-acc-tab],[data-acc-sso],[data-acc-skip],[data-acc-forgot],[data-acc-pwshow],[data-acc-role],[data-acc-goal],[data-acc-ob],[data-acc-obcycle],[data-acc-plan],[data-acc-connect],[data-acc-close],[data-acc-allow],[data-acc-enter],[data-acc-manage],[data-acc-notify],[data-acc-filter],[data-acc-syncnow],[data-acc-syncall],[data-acc-type],[data-acc-disc],[data-acc-apishow],[data-acc-copy],[data-acc-rotate],[data-acc-vcycle],[data-acc-change],[data-acc-undodown],[data-acc-unpause],[data-acc-scroll],[data-acc-buy],[data-acc-addcard],[data-acc-pay],[data-acc-cancel],[data-acc-pref],[data-acc-tfa],[data-acc-del]');
  if(!t){const L=document.getElementById('accLayer');if(L&&e.target===L&&ACC_L&&ACC_L.phase!=='busy')accCloseLayer();return}
  const d=t.dataset,A=S.acc;
  if('accMenu' in d){const u=A.user;const m=popMenu(t,`<div class="acc-mh"><span class="av">${esc(accInit(u.name))}</span><span style="min-width:0"><b>${esc(u.name)}</b><br><span class="muted">${esc(u.email)}</span></span></div><hr><button data-acc-nav="account">${I.user} Profil</button><button data-acc-nav="billing">${I.card} Abo & Rechnungen <span class="tag">${accPlan().n}</span></button><button data-acc-nav="connect">${I.plug} Verbindungen <span class="tag">${accConnCount()}</span></button><hr><button data-acc-logout>${I.out} Abmelden</button>`);m.classList.add('acc-menu');m.style.left=Math.max(12,Math.min(t.getBoundingClientRect().right-m.offsetWidth,innerWidth-m.offsetWidth-12))+'px';const f=m.querySelector('button');f&&f.focus();return}
  if(d.accNav){closeMenus();go(d.accNav);return}
  if('accLogout' in d)return accLogout();
  if(d.accTab){if(A.screen!==d.accTab){A.screen=d.accTab;A.err={};A.pwShow=false;if(d.accTab==='login'&&!A.form.lemail&&A.form.email)A.form.lemail=A.form.email;accAuthRender()}return}
  if(d.accSso)return accSso(d.accSso);
  if('accSkip' in d){S.acc.user={name:BRANDS[0].name,email:'aid@beispiel.de'};return accEnterApp('guest')}
  if('accForgot' in d){const m=A.form.lemail.trim();return toast(m?`Link zum Zurücksetzen an ${m} gesendet (Demo)`:'Gib zuerst deine E-Mail-Adresse ein')}
  if('accPwshow' in d){A.pwShow=!A.pwShow;accAuthRender();return accFocusSel('#accPw')}
  if(d.accRole){A.ob.role=d.accRole;A.ob.err={};if(d.accRole==='agency')A.ob.plan='agency';else if(A.ob.plan==='agency')A.ob.plan='pro';return accAuthRender()}
  if(d.accGoal){const g=A.ob.goals,i=g.indexOf(d.accGoal);i>=0?g.splice(i,1):g.push(d.accGoal);A.ob.err={};return accAuthRender()}
  if(d.accOb){if(d.accOb==='back'){A.ob.step=Math.max(1,A.ob.step-1);A.ob.err={};accAuthRender();return accFocusSel('#accAuth [data-acc-ob="back"]')}return accObNext()}
  if(d.accObcycle){A.ob.cycle=d.accObcycle;return accAuthRender()}
  if(d.accPlan){A.ob.plan=d.accPlan;return accAuthRender()}
  if(d.accConnect)return accOAuth(d.accConnect,()=>{if(A.screen==='ob'&&document.getElementById('accAuth')&&!document.getElementById('accAuth').hidden)accAuthRender();else accRender()});
  if('accClose' in d){if(ACC_L&&ACC_L.phase==='busy')return;return accCloseLayer()}
  if('accAllow' in d)return accAllow();
  if('accPay' in d)return accPay();
  if('accEnter' in d)return accEnterApp('signup');
  if(d.accManage){A.conns[d.accManage].confirm=false;return accOpenLayer({type:'manage',id:d.accManage})}
  if(d.accNotify){const x=ACC_INT.find(i=>i.id===d.accNotify);return toast(`Vorgemerkt: Wir sagen Bescheid, sobald ${x.n} verfügbar ist`)}

function grCore(lang,src){
 const c=GR_CORE[lang],t=src.t;
 if(lang==='de')return {...c,hook:t};
 if(lang==='en')return {...c,hook:GR_EN_T[POSTS.indexOf(src)]||t};
 return {...c,hook:c.h[POSTS.indexOf(src)]||c.h[0]};
}
function grBlocks(f,lang,src){
 const c=grCore(lang,src),rich=!!c.ptsL,en=lang==='en';
 const L=(de,e)=>en?e:de;
 switch(f){
  case 'clips':return [
   {l:'Clip 1 · 00:00–00:31',t:`Hook: „${c.hook}“\n${rich?L('Schwerpunkt: Problem. Endet mit Keyword-CTA.','Focus: the problem. Ends with keyword CTA.'):c.problem}`},
   {l:'Clip 2 · 00:12–00:41',t:`Hook: „${c.three}“\n${c.pts.map((p,i)=>`0${i+1} ${p}`).join('\n')}`},
   {l:'Clip 3 · 00:29–00:58',t:`Hook: „${c.proofHook}“\n${c.proof}`},
   {l:'Untertitel',t:rich?L('Eingebrannt, 2 Zeilen, Keywords in Orange · 9:16','Burned in, 2 lines, keywords in orange · 9:16'):'SRT + eingebrannt · 9:16'}];
  case 'carousel':return [{l:'Slide 1 · Cover',t:c.hook},{l:'Slide 2',t:c.problem},...c.pts.map((p,i)=>({l:`Slide ${i+3}`,t:`0${i+1} · ${rich?c.ptsL[i]:p}`})),{l:'Slide 6 · Beleg',t:c.proof},...(rich?[{l:'Slide 7',t:c.today}]:[]),{l:`Slide ${rich?8:7} · CTA`,t:c.cta}];
  case 'linkedin':return rich?[{t:`${c.hook}.\n\n${c.problem}\n\n${c.three}\n\n${c.ptsL.map((p,i)=>`${i+1}. ${p}`).join('\n')}\n\n${c.proof}\n\n${c.ctaLi}\n\n${c.hash}`}]:[{t:`${c.hook}\n\n${c.problem}\n\n${c.pts.map(p=>'→ '+p).join('\n')}\n\n${c.proof}\n\n${c.cta}`}];
  case 'short':return [{l:L('Titel','Title'),t:`${c.hook} #shorts`},{l:L('Schnitt','Cut'),t:'00:00–00:45 · 9:16 · Untertitel eingebrannt'},{l:L('Beschreibung','Description'),t:rich?c.ytDesc:c.problem}];
  case 'newsletter':return [{l:L('Betreff','Subject'),t:c.hook},{l:'Preheader',t:rich?c.nlPre:c.three},{l:'Intro',t:rich?`${c.nlHi}\n\n${c.nlIntro}`:`${c.problem}\n\n${c.proof}`}];
  case 'xthread':return [{l:'1/5',t:c.hook},{l:'2/5',t:c.problem},{l:'3/5',t:`${c.three}\n${c.pts.map(p=>'– '+p).join('\n')}`},{l:'4/5',t:c.proof},{l:'5/5',t:c.cta}];

 }
 return [];
}

const _answer=answer;
answer=function(q){
  const l=q.toLowerCase(),act=(v,t)=>`<button class="btn" style="margin-top:10px" data-go="${v}">${t} →</button>`;
  if(l.includes('umsatz')||l.includes('geld')||l.includes('kunden bring'))return `Im September hat dein Content <b>${fmt(Math.round(17*1200*B().scale))} €</b> nachweisbar gebracht. Top-Beitrag: das Karussell „Fallstudie: 42 → 148 Closings“ (62 Leads, 21 Calls, 6 Kunden).<ul><li>Karussells: höchste Call-Quote (34 %)</li><li>Reels: meiste Leads, aber nur 29 % buchen</li><li>Story-Antworten „JA“: günstigster Weg zum Termin</li></ul><div class="src">Basis: Revenue Attribution · Stripe · cal.com · Modell Gewichtet</div>${act('biz','Revenue Attribution öffnen')}`;
  if(l.includes('dm')||l.includes('automation')||l.includes('keyword'))return `Dein Keyword „SYSTEM“ hat 41 Leads gebracht, die Antwortquote liegt bei 63 %. Vorschlag: Nach der ersten DM eine Qualifizierungsfrage zum Umsatz einbauen, dann landen nur passende Leads im Kalender.<div class="src">Basis: DM Autopilot, letzte 30 Tage</div>${act('autopilot','DM Autopilot öffnen')}`;
  if(l.includes('trend')||l.includes('nische')||l.includes('konkurrenz')||l.includes('wettbewerb'))return `In deiner Nische wachsen gerade <b>„Ich habe X getestet“-Hooks</b> und <b>Zahlen-Karussells</b>. Deine Watchtime liegt über dem Schnitt, deine Posting-Frequenz darunter.<div class="src">Basis: Trend-Radar · anonymisierte Benchmarks</div>${act('radar','Trend-Radar öffnen')}`;
  if(l.includes('übersetz')||l.includes('englisch')||l.includes('repurpose')||l.includes('wiederverw'))return `Dein Reel „Warum 1 Mio. Views keine Kunden bringen“ eignet sich am besten: Daraus werden 3 Clips, 1 Karussell, 1 LinkedIn-Post und ein Newsletter, auf Wunsch auch auf Englisch und Spanisch.<div class="src">Basis: Top Content · Completion 48 %</div>${act('repurpose','Repurpose starten')}`;
  if(l.includes('report')||l.includes('zusammenfass')||l.includes('woche lief'))return `KW 40 kurz: Views und Leads steigen, 6 Abschlüsse aus Content. Schwachstelle: nur 2 Karussells, obwohl sie am meisten Umsatz bringen.<div class="src">Basis: CEO Report KW 40</div>${act('report','Ganzen Report öffnen')}`;
  return _answer(q);
};

function tkD(s){const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function tkIso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function tkAdd(s,n){const d=tkD(s);d.setDate(d.getDate()+n);return tkIso(d)}
function tkDiff(s){return Math.round((tkD(s)-tkD(TK_TODAY))/864e5)}
function tkShort(s){const d=tkD(s);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'}
function tkDate(s){return TK_WD[tkD(s).getDay()]+', '+tkShort(s)}
function tkOver(t){return t.status!=='Erledigt'&&!!t.due&&t.due<TK_TODAY}
function tkRel(t){
  if(!t.due)return {l:'Kein Datum',c:''};
  const n=tkDiff(t.due);
  if(t.status!=='Erledigt'&&n<0)return {l:n===-1?'Gestern':'seit '+(-n)+' Tagen',c:'bad'};
  return {l:n===0?'Heute':n===1?'Morgen':n===-1?'Gestern':tkDate(t.due),c:n===0&&t.status!=='Erledigt'?'warn':''};
}

function tkKey(el){if(!el||!el.attributes||el===document.body)return null;const a=[...el.attributes].filter(x=>x.name.startsWith('data-tk-')||x.name==='id');return a.length?a.map(x=>`[${x.name}="${CSS.escape(x.value)}"]`).join(''):null}
function tkRender(focusSel){
  const ae=document.activeElement,k=focusSel||tkKey(ae);let ss=null,se=null;
  if(!focusSel){try{if(ae&&typeof ae.selectionStart==='number'){ss=ae.selectionStart;se=ae.selectionEnd}}catch(_){}}
  const db=document.querySelector('.tk-drb'),st=db?db.scrollTop:0;
  const bd=document.querySelector('.tk-board'),bs=bd?bd.scrollLeft:0;
  render();
  const nb=document.querySelector('.tk-drb');if(nb&&!focusSel)nb.scrollTop=st;
  const nbd=document.querySelector('.tk-board');if(nbd)nbd.scrollLeft=bs;

}

function tkOpen(id){S.tk.anim=!S.tk.open;S.tk.open=+id;S.tk.confirm=false;S.tk.draft={sub:'',tag:'',cmt:''};tkRender('#tkDrT')}
function tkClose(){const id=S.tk.open;S.tk.open=null;S.tk.confirm=false;tkRender('[data-tk-open="'+id+'"]')}
function tkNew(o){const t=tkMk(Object.assign({brand:B().id,created:'Heute, '+tkNow()},o));t.log=[{who:o.by||'AM',t:o.by==='auto'?'hat die Aufgabe automatisch erstellt':'hat die Aufgabe erstellt',at:'Heute, '+tkNow()}];S.tk.items.push(t);INDEX.push({g:'Aufgaben',t:t.title,v:'tasks'});return t}
function tkAutoShot(silent){
  if(!S.tk.auto.shot||!S.cards)return;
  S.cards.filter(c=>c.c==='Gedreht'&&!S.tk.seenShot.includes(c.id)).forEach(c=>{
    S.tk.seenShot.push(c.id);S.tk.runs.shot++;
    const t=tkNew({title:'Schnitt: '+c.t,who:['ED'],due:tkAdd(TK_TODAY,2),prio:'Hoch',list:'Content',card:c.id,est:4,tags:['Automation'],by:'auto',desc:'Automatisch erstellt: Content-Karte wurde auf „Gedreht“ verschoben.'});
    S.tk.feed.unshift({who:'auto',t:'hat „'+t.title+'“ an Editor vergeben',task:'Automation',at:'Heute, '+tkNow()});
    if(!silent)setTimeout(()=>toast('Automation: „Schnitt“ an Editor vergeben'),1300);
  });
}
function tkParseNote(txt){
  const lines=txt.split(/\n|(?<=[.!?])\s+/).map(s=>s.replace(/^[\s\-–•*\d.)]+/,'').trim()).filter(s=>s.length>14&&!/^teammeeting|^meeting|^notiz/i.test(s));
  const out=lines.slice(0,5).map(s=>{
    const l=s.toLowerCase();
    let who='AM';
    if(/editor|schnitt|cut|untertitel|export/.test(l))who='ED';else if(/setter|lead|termin|\bdm/.test(l))who='ST';else if(/content-manager|karussell|caption|posting|planen|\bads\b|budget|kampagne/.test(l))who='CM';
    let due=tkAdd(TK_TODAY,3),prio='Normal';
    if(/morgen/.test(l)){due=tkAdd(TK_TODAY,1);prio='Hoch'}else if(/montag/.test(l))due='2026-10-05';else if(/dienstag/.test(l))due='2026-10-06';else if(/mittwoch/.test(l))due='2026-10-07';else if(/donnerstag/.test(l))due='2026-10-08';else if(/freitag/.test(l))due='2026-10-09';else if(/kw ?42/.test(l))due='2026-10-12';
    if(/sofort|dringend|heute/.test(l)){due=TK_TODAY;prio='Dringend'}
    const list=/\bads\b|budget|kampagne|landing|funnel/.test(l)?'Funnel & Ads':/lead|termin|setter|call/.test(l)?'Sales':/dreh|aufnehm|testimonial/.test(l)?'Drehtag':/rechnung|vertrag/.test(l)?'Admin':'Content';
    let title=s.replace(/^(editor|setter|content-manager|aid|cm)\s*:?\s*(soll|muss|wird)?\s*/i,'').replace(/,?\s*bis (morgen|montag|dienstag|mittwoch|donnerstag|freitag|ende der woche)\b/i,'').replace(/\s+bis (morgen|montag|dienstag|mittwoch|donnerstag|freitag)\b/i,'').replace(/[.;]$/,'').trim();
    title=title.charAt(0).toUpperCase()+title.slice(1);
    return {title,who,due,prio,list,on:true};
  });
  const fill=[{title:'Nächsten Drehtag terminieren',who:'AM',due:tkAdd(TK_TODAY,3),prio:'Normal',list:'Drehtag',on:true},{title:'Ergebnisse des Meetings ans Team schicken',who:'CM',due:tkAdd(TK_TODAY,1),prio:'Normal',list:'Admin',on:true},{title:'Offene Leads im CRM nachfassen',who:'ST',due:tkAdd(TK_TODAY,2),prio:'Hoch',list:'Sales',on:true}];
  while(out.length<3)out.push(fill[out.length]);
  return out;
}

  if(!el)return;
  const d=el.dataset,T=S.tk,cur=T.open&&tkFind(T.open);
  if(d.tkGoto!==undefined){S.tk.anim=true;S.tk.open=+d.tkGoto;S.tk.confirm=false;go('tasks');const f=document.getElementById('tkDrT');f&&f.focus({preventScroll:true});return}
  if(d.tkOpen!==undefined)return tkOpen(d.tkOpen);
  if(d.tkClose!==undefined)return tkClose();
  if(d.tkV){T.view=d.tkV;return tkRender()}
  if(d.tkMine!==undefined){T.mine=!T.mine;return tkRender()}
  if(d.tkClient!==undefined){T.client=!T.client;return tkRender()}
  if(d.tkColl){T.collapsed[d.tkColl]=!T.collapsed[d.tkColl];return tkRender()}
  if(d.tkDone){const t=tkFind(d.tkDone);if(!t)return;if(t.status==='Erledigt')tkSetStatus(t,t.prev&&t.prev!=='Erledigt'?t.prev:'Offen');else{t.prev=t.status;tkSetStatus(t,'Erledigt')}tkRender();return toast(t.status==='Erledigt'?'Erledigt · stark':'Wieder geöffnet')}
  if(d.tkWk!==undefined){T.wk=+d.tkWk;return tkRender()}
  if(d.tkPanel!==undefined){T.panel=T.panel===d.tkPanel||!d.tkPanel?null:d.tkPanel;return tkRender(T.panel==='dt'?'#tkDtDate':T.panel==='note'?'#tkNoteIn':null)}
  if(d.tkSpace!==undefined){S.brand=+d.tkSpace;S.seq=null;S.chat=[];T.open=null;tkRender();return toast('Space: '+B().name)}
  if(d.tkList!==undefined){T.fList=d.tkList;return tkRender()}
  if(d.tkWho){T.fWho=d.tkWho;T.view='list';tkRender();return window.scrollTo({top:0})}
  if(d.tkReset!==undefined){Object.assign(T,{q:'',fWho:'',fPrio:'',fList:'',mine:false,client:false});return tkRender()}
  if(d.tkQadd){T.qa.status=d.tkQadd;tkRender('#tkQaT');return}
  if(d.tkAuto){T.auto[d.tkAuto]=!T.auto[d.tkAuto];tkRender();if(d.tkAuto==='shot'&&T.auto.shot)tkAutoShot();return toast(T.auto[d.tkAuto]?'Automation aktiviert':'Automation pausiert')}
  if(d.tkAutotest==='hot'){if(!T.auto.hot)return toast('Regel ist pausiert – erst aktivieren');T.runs.hot++;const n=['@lisa.coaching','@max.founder','@sarah.mindset'][T.runs.hot%3];const t=tkNew({title:'Termin anbieten: '+n+' (heiß, Keyword „Playbook“)',who:['ST'],due:TK_TODAY,prio:'Dringend',list:'Sales',est:.5,tags:['DM Autopilot'],by:'auto',desc:'Lead hat im DM Autopilot alle Qualifizierungsfragen beantwortet. Termin-Link: cal.com/aid-muric/analyse'});S.tk.feed.unshift({who:'auto',t:'hat „'+t.title+'“ an Setter vergeben',task:'Automation',at:'Heute, '+tkNow()});tkRender();return toast('Testlauf: Aufgabe an Setter erstellt')}
  if(d.tkAutotest==='wa'){const n=tkBrandItems().filter(tkOver).length;return toast(`WhatsApp 08:00: „${n} Aufgaben überfällig – älteste: ${tkSort(tkBrandItems().filter(tkOver))[0]?.title||'–'}“`)}
  if(d.tkDtrun!==undefined){
    const D=T.dt;if(!D.date)return toast('Bitte ein Datum für den Drehtag wählen');
    return think(()=>{const ch='dt'+Date.now(),card=D.card?+D.card:null;let first=null;
      tkDtSteps().forEach((s,i)=>{const t=tkNew({title:s.k==='Drehtag'?D.title||'Drehtag':s.k==='Schnitt'?`Schnitt: ${D.n} Videos (${D.title})`:`${s.k} · ${D.title}`,who:s.who,due:tkAdd(D.date,s.off),prio:s.prio,list:s.list,est:s.est,subs:s.subs.slice(),card,chain:ch,ord:i,shared:!!s.shared,tags:['Drehtag-Plan'],desc:i?'Startet, sobald „'+tkDtSteps()[i-1].k+'“ erledigt ist.':'Erster Schritt des Drehtag-Plans.'});if(!first)first=t});
      T.panel=null;T.view='list';T.fList='';spend(3,'Drehtag-Plan: 5 Aufgaben verteilt');tkRender();
      const r=document.querySelector('[data-tk-open="'+first.id+'"]');r&&r.scrollIntoView({block:'center'});r&&r.focus({preventScroll:true})},1100);
  }
  if(d.tkNoterun!==undefined){const txt=(document.getElementById('tkNoteIn')||{}).value||T.noteIn;T.noteIn=txt;if(txt.trim().length<15)return toast('Bitte eine Notiz mit etwas mehr Text einfügen');return think(()=>{T.noteOut=tkParseNote(txt);spend(2,`${T.noteOut.length} Aufgaben erkannt`);tkRender('[data-tk-noteok]')},1100)}
  if(d.tkNoteok!==undefined){const sel=(T.noteOut||[]).filter(o=>o.on);sel.forEach(o=>tkNew({title:o.title,who:[o.who],due:o.due,prio:o.prio,list:o.list,est:1,tags:['Aus Notiz']}));T.noteOut=null;T.panel=null;T.view='list';tkRender();return toast(sel.length+' Aufgaben übernommen')}
  if(!cur)return;
  if(d.tkWhot){const i=cur.who.indexOf(d.tkWhot),m=tkM(d.tkWhot);if(i>=0){if(cur.who.length===1)return toast('Mindestens eine Person muss zuständig sein');cur.who.splice(i,1);tkLog(cur,'hat '+m.n+' entfernt')}else{cur.who.push(d.tkWhot);tkLog(cur,'hat '+m.n+' zugewiesen');if(m.client&&!cur.shared){cur.shared=true}}return tkRender()}
  if(d.tkUntag!==undefined){const g=cur.tags.splice(+d.tkUntag,1)[0];tkLog(cur,'hat Tag #'+g+' entfernt');return tkRender('#tkTagIn')}
  if(d.tkUnsub!==undefined){const s=cur.subs.splice(+d.tkUnsub,1)[0];tkLog(cur,'hat Unteraufgabe „'+s.t+'“ entfernt');return tkRender('#tkSubIn')}
  if(d.tkShared!==undefined){cur.shared=!cur.shared;tkLog(cur,cur.shared?'hat die Aufgabe für den Klienten freigegeben':'hat die Freigabe für den Klienten entfernt');return tkRender()}
  if(d.tkMen){const ta=document.getElementById('tkCmtIn');if(!ta)return;const v=ta.value,p=ta.selectionStart??v.length,ins=(p&&!/\s$/.test(v.slice(0,p))?' ':'')+'@'+d.tkMen+' ';ta.value=v.slice(0,p)+ins+v.slice(p);T.draft.cmt=ta.value;ta.focus();const np=p+ins.length;ta.setSelectionRange(np,np);return}
  if(d.tkDel!==undefined){T.confirm=true;return tkRender('[data-tk-delno]')}
  if(d.tkDelno!==undefined){T.confirm=false;return tkRender('[data-tk-del]')}
  if(d.tkDelyes!==undefined){const title=cur.title;T.items=T.items.filter(t=>t!==cur);T.open=null;T.confirm=false;S.tk.feed.unshift({who:'AM',t:'hat eine Aufgabe gelöscht',task:title,at:'Heute, '+tkNow()});tkRender('#tkQaT');return toast('„'+title.slice(0,40)+(title.length>40?'…':'')+'“ gelöscht')}
});

document.addEventListener('change',e=>{
  const el=e.target;if(!el.closest||!el.dataset)return;const d=el.dataset,T=S.tk;
  if(d.tkStatus){const t=tkFind(d.tkStatus);tkSetStatus(t,el.value);tkRender();return toast('Status: '+el.value)}
  if(d.tkFwho!==undefined){T.fWho=el.value;return tkRender()}
  if(d.tkFprio!==undefined){T.fPrio=el.value;return tkRender()}
  if(d.tkSort!==undefined){T.sort=el.value;return tkRender()}
  if(d.tkQa){T.qa[d.tkQa]=el.value;return}
  if(d.tkDt){T.dt[d.tkDt]=d.tkDt==='n'?Math.max(1,Math.min(20,+el.value||1)):el.value;if(d.tkDt!=='title')tkRender();return}
  if(d.tkNotex!==undefined){T.noteOut[+d.tkNotex].on=el.checked;return tkRender()}
  const cur=T.open&&tkFind(T.open);if(!cur)return;
  if(d.tkSub!==undefined){const s=cur.subs[+d.tkSub];s.d=el.checked;tkLog(cur,(s.d?'hat „':'hat „')+s.t+(s.d?'“ abgehakt':'“ wieder geöffnet'));return tkRender()}
  const f=d.tkF;if(!f)return;
  if(f==='title'){const v=el.value.trim();if(!v){el.value=cur.title;return toast('Titel darf nicht leer sein')}cur.title=v;tkLog(cur,'hat den Titel geändert');return}
  if(f==='desc'){cur.desc=el.value;tkLog(cur,'hat die Beschreibung bearbeitet');return}
  if(f==='status'){tkSetStatus(cur,el.value);return tkRender()}
  if(f==='prio'){cur.prio=el.value;tkLog(cur,'hat die Priorität auf „'+el.value+'“ gesetzt');return tkRender()}
  if(f==='due'){cur.due=el.value||null;tkLog(cur,el.value?'hat das Fälligkeitsdatum auf '+tkDate(el.value)+' gesetzt':'hat das Fälligkeitsdatum entfernt');return tkRender()}
  if(f==='list'){cur.list=el.value;tkLog(cur,'hat die Aufgabe nach „'+el.value+'“ verschoben');return tkRender()}
  if(f==='est'){cur.est=Math.max(0,+el.value||0);tkLog(cur,'hat die Schätzung auf '+tkH(cur.est)+' gesetzt');return tkRender()}
  if(f==='card'){cur.card=el.value?+el.value:null;tkLog(cur,el.value?'hat Content verknüpft':'hat die Content-Verknüpfung entfernt');return tkRender()}
});

document.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset)return;const d=el.dataset,T=S.tk;
  if(d.tkQ!==undefined){T.q=el.value;return tkRender()}
  if(d.tkQa){T.qa[d.tkQa]=el.value;if(T.qa.err&&d.tkQa==='title'&&el.value.trim()){T.qa.err='';el.removeAttribute('aria-invalid');const er=document.getElementById('tkQaErr');er&&er.remove()}return}
  if(d.tkNote!==undefined){T.noteIn=el.value;return}
  if(d.tkDraft){T.draft[d.tkDraft]=el.value;return}
  if(d.tkDt==='title'){T.dt.title=el.value;return}
  const cur=T.open&&tkFind(T.open);if(!cur)return;
  if(d.tkF==='title'&&el.value.trim()){cur.title=el.value.replace(/\n/g,' ')}
  if(d.tkF==='desc')cur.desc=el.value;
});

document.addEventListener('submit',e=>{
  const f=e.target.closest&&e.target.closest('[data-tk-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.tkForm,T=S.tk,cur=T.open&&tkFind(T.open);
  if(k==='qa'){const q=T.qa;if(!q.title.trim()){q.err='Bitte gib der Aufgabe einen Titel.';return tkRender('#tkQaT')}
    const t=tkNew({title:q.title.trim(),who:[q.who],due:q.due||null,list:q.list,status:q.status||'Offen'});tkLog(t,'hat die Aufgabe erstellt');t.log.pop();
    q.title='';q.err='';q.status='Offen';if(T.fList&&T.fList!==t.list)T.fList='';if(T.client&&!t.shared)T.client=false;
    tkRender('#tkQaT');return toast(`Aufgabe für ${tkM(t.who[0]).n} angelegt`)}
  if(!cur)return;
  if(k==='sub'){const v=T.draft.sub.trim();if(!v)return;cur.subs.push({t:v,d:false});T.draft.sub='';tkLog(cur,'hat Unteraufgabe „'+v+'“ hinzugefügt');return tkRender('#tkSubIn')}
  if(k==='tag'){const v=T.draft.tag.trim().replace(/^#/,'');if(!v)return;if(!cur.tags.includes(v))cur.tags.push(v);T.draft.tag='';tkLog(cur,'hat Tag #'+v+' hinzugefügt');return tkRender('#tkTagIn')}
  if(k==='cmt'){const v=T.draft.cmt.trim();if(!v)return;cur.comments.push({who:'AM',t:v,at:'Heute, '+tkNow()});T.draft.cmt='';tkLog(cur,'hat einen Kommentar geschrieben');
    const men=[...new Set((v.match(/@(Aid|Editor|Setter|CM|Klient)\b/g)||[]).map(x=>x.slice(1)))].filter(x=>x!=='Aid');
    tkRender('#tkCmtIn');const c=document.querySelector('.tk-cmts .tk-cmt:last-child');c&&c.scrollIntoView({block:'nearest'});
    return toast(men.length?men.join(', ')+' '+(men.length>1?'wurden':'wurde')+' benachrichtigt':'Kommentar gespeichert')}
});

document.addEventListener('keydown',e=>{
  const T=S.tk;if(S.view!=='tasks')return;
  const dr=document.querySelector('.tk-drawer'),cmd=document.getElementById('cmdk');
  if(dr&&cmd&&!cmd.hidden)return;
  if(e.key==='Escape'&&dr){e.preventDefault();if(T.confirm){T.confirm=false;return tkRender('[data-tk-del]')}return tkClose()}
  if(e.key==='Tab'&&dr){const f=[...dr.querySelectorAll('button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(!dr.contains(document.activeElement)){e.preventDefault();a.focus();return}
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}return}
  const tg=e.target;
  if(e.key==='Enter'&&tg.dataset&&tg.dataset.tkF==='title'){e.preventDefault();tg.blur();return}
  if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&tg.id==='tkCmtIn'){e.preventDefault();tg.form&&tg.form.requestSubmit();return}
  if(e.shiftKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&tg.dataset&&tg.dataset.tkKey){
    e.preventDefault();const t=tkFind(tg.dataset.tkKey),i=TK_STATUS.findIndex(s=>s.k===t.status),j=i+(e.key==='ArrowRight'?1:-1);
    if(j<0||j>=TK_STATUS.length)return;tkSetStatus(t,TK_STATUS[j].k);tkRender('[data-tk-key="'+t.id+'"]');toast('Verschoben nach „'+t.status+'“')}
});

/* board drag & drop (delegated, HTML5 DnD) */
let tkDragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-tk-drag]');if(!c)return;tkDragId=+c.dataset.tkDrag;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(tkDragId))}catch(_){}setTimeout(()=>c.classList.add('is-drag'),0)});
document.addEventListener('dragend',()=>{tkDragId=null;document.querySelectorAll('.tk-col.over,.tk-card.is-drag').forEach(x=>x.classList.remove('over','is-drag'))});
document.addEventListener('dragover',e=>{if(tkDragId==null)return;const col=e.target.closest&&e.target.closest('[data-tk-col]');document.querySelectorAll('.tk-col.over').forEach(c=>c!==col&&c.classList.remove('over'));if(!col)return;e.preventDefault();e.dataTransfer.dropEffect='move';col.classList.add('over')});
document.addEventListener('drop',e=>{
  if(tkDragId==null){setTimeout(()=>{if(S.view!=='tasks')tkAutoShot()},30);return}
  const col=e.target.closest&&e.target.closest('[data-tk-col]');if(!col)return;e.preventDefault();
  const t=tkFind(tkDragId);tkDragId=null;if(!t||t.status===col.dataset.tkCol){tkRender();return}
  tkSetStatus(t,col.dataset.tkCol);tkRender();toast('Verschoben nach „'+t.status+'“');
});

/* boot */
try{const th=localStorage.getItem('bos-theme');if(th)document.documentElement.dataset.theme=th;const v=localStorage.getItem('bos-view');if(v&&VIEWS[v])S.view=v}catch(e){}
const h=location.hash.replace('#','');if(VIEWS[h])S.view=h;
render();
</script>
</body></html>
