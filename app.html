<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23FF6D29%22 stroke-width=%221.6%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2210.4%22/%3E%3Cpath d=%22M9 6.8v10.4h3.6a2.6 2.6 0 0 0 0-5.2H9m0 0h3.2a2.6 2.6 0 0 0 0-5.2H9%22/%3E%3C/svg%3E"><link rel="stylesheet" href="fonts/fonts.css"><style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Brandscale App</title>
<style>
/* Ember: warm near-black ground, one orange glow from the left, glass pills; one grotesk in Regular/Medium/Semibold */
:root{
  --bg:#161316; --solid:#211A19; --surface:rgba(255,255,255,.055); --sunk:rgba(255,255,255,.035); --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.22);
  --fg:#FFFFFF; --fg-2:#D9D1CC; --muted:#A79E99; --faint:#6E6460;
  --accent:#FF6D29; --accent-2:#FF9A6A; --on-accent:#FFFFFF; --accent-soft:rgba(255,109,41,.16);
  --glow:rgba(255,109,41,.62); --glow-2:rgba(69,48,39,.9);
  --good:#7FD6A3; --good-bg:rgba(127,214,163,.12); --warn:#FFB27A; --warn-bg:rgba(255,109,41,.16); --bad:#FF8A7A; --bad-bg:rgba(255,120,100,.14);
  --chart:#FF6D29; --chart-2:#BABABA; --chart-fill:rgba(255,109,41,.14);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -22px rgba(0,0,0,.7);
  --f-ui:"Hanken Grotesk","Neue Montreal","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-serif:var(--f-ui); --f-mono:var(--f-ui);
  --r:14px; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F4EEE9; --solid:#FFFFFF; --surface:rgba(255,255,255,.62); --sunk:rgba(69,48,39,.05); --line:rgba(69,48,39,.13); --line-2:rgba(69,48,39,.24);
  --fg:#161316; --fg-2:#453027; --muted:#857670; --faint:#BABABA;
  --accent:#FF6D29; --accent-2:#C2410C; --on-accent:#FFFFFF; --accent-soft:rgba(255,109,41,.13);
  --glow:rgba(255,109,41,.38); --glow-2:rgba(255,190,150,.45);
  --good:#1F7A4D; --good-bg:#E3F1E8; --warn:#B4470F; --warn-bg:#FDE5D7; --bad:#B23B3B; --bad-bg:#F8E3E0;
  --chart:#E8581A; --chart-2:#A89D97; --chart-fill:rgba(255,109,41,.12);
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 16px 36px -22px rgba(69,48,39,.35); color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.02em;text-transform:uppercase}
.muted{color:var(--muted)} .fg2{color:var(--fg-2)}
.num{font-variant-numeric:tabular-nums}
em.s{font-family:var(--f-serif);font-style:italic;font-weight:400;color:var(--muted);font-size:1.1em;letter-spacing:-.005em}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:16px 12px;border-right:1px solid var(--line);background:var(--surface)}
.logo{display:flex;align-items:center;gap:9px;padding:4px 8px 10px;font-weight:400;letter-spacing:.08em;font-size:14px}
.logo svg{width:20px;height:20px}
.logo b{font-weight:400}
.logo small{margin-left:auto}
.brandsw{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);text-align:left}
.brandsw:hover{border-color:var(--line-2)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;flex:none}
.brandsw .t{min-width:0;flex:1}
.brandsw .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandsw .t span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:1px;margin-top:8px}
.nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--fg-2);text-align:left;font-weight:450}
.nav button svg{width:16px;height:16px;flex:none;opacity:.8}
.nav button:hover{background:var(--sunk);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:500}
.nav .grp{margin:14px 10px 4px;color:var(--faint)}
.nav .kbd{margin-left:auto}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.credit{padding:10px;border:1px solid var(--line);border-radius:var(--r)}
.bar{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.kbd{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.demo{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:500}
.demo i{width:6px;height:6px;border-radius:50%;background:currentColor}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);text-align:left}
.search span:not(.kbd){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.search .kbd{flex:none}
.top .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.ibtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--surface);position:relative}
.ibtn svg{width:16px;height:16px}
.ibtn .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.burger{display:none}

.page{padding:28px;display:flex;flex-direction:column;gap:20px;max-width:1360px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{margin:0;font-weight:400;font-size:32px;letter-spacing:-.03em;line-height:1.1;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin:0;font-size:14px;font-weight:500}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}

.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .v{font-size:28px;font-weight:300;letter-spacing:-.03em;line-height:1}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:500;padding:1px 7px;border-radius:999px}
.up{color:var(--good);background:var(--good-bg)} .dn{color:var(--bad);background:var(--bad-bg)}
.spark{height:34px;width:100%}

.chips{display:flex;gap:4px;flex-wrap:wrap;padding:3px;background:var(--sunk);border-radius:999px;border:1px solid var(--line)}
.chips button{border:0;background:none;padding:5px 12px;border-radius:999px;color:var(--fg-2);font-size:13px}
.chips button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-weight:500}

.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:13px}
.btn:hover{border-color:var(--fg-2)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.pri:hover{opacity:.9}
.btn svg{width:14px;height:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;color:var(--fg-2);white-space:nowrap}
.tag.good{color:var(--good);background:var(--good-bg);border-color:transparent}
.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.tag.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.tag.ink{background:var(--accent);color:var(--on-accent);border-color:transparent}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:var(--f-mono);font-weight:400;font-size:10.5px;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow-x:auto}

.insight{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.insight .ic{width:28px;height:28px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.insight .ic svg{width:14px;height:14px}
.insight p{margin:0}
.insight .src{margin-top:6px;font-size:12px;color:var(--muted)}

/* tasks */
.task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input{width:18px;height:18px;accent-color:var(--accent)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.tt b{font-weight:500}
.tt span{display:block;font-size:12.5px;color:var(--muted)}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:260px}
.col.over{border-color:var(--fg-2);border-style:dashed}
.col .ch{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:grab}
.kc:active{cursor:grabbing}
.kc b{font-weight:500;line-height:1.35}
.kc .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kc .who{margin-left:auto;width:22px;height:22px;font-size:9.5px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .dh{padding:8px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;background:var(--sunk);border-bottom:1px solid var(--line)}
.cal .d{min-height:96px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.cal .d:nth-child(7n){border-right:0}
.cal .d.o{background:var(--sunk);color:var(--faint)}
.cal .d .n{font-size:12px;color:var(--muted)}
.cal .d.today .n{color:var(--on-accent);background:var(--accent);border-radius:999px;width:22px;text-align:center}
.ev{font-size:11.5px;padding:3px 6px;border-radius:6px;background:var(--accent-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.pub{background:var(--good-bg);color:var(--good)}

/* story studio */
.studio{display:grid;grid-template-columns:200px minmax(0,1fr) 280px;gap:16px;align-items:start}
.slides{display:flex;flex-direction:column;gap:8px}
.sthumb{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left}
.sthumb[aria-current="true"]{border-color:var(--fg);box-shadow:var(--shadow)}
.sthumb .mini{width:44px;aspect-ratio:9/16;border-radius:5px;overflow:hidden}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;background:var(--sunk);border:1px solid var(--line);border-radius:14px}
.story{position:relative;width:300px;max-width:100%;aspect-ratio:9/16;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);container-type:inline-size}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;padding:9cqw 8cqw 10cqw;gap:5cqw;font-family:var(--sf,var(--f-ui))}
.sl .bar3{display:flex;gap:1.2cqw}
.sl .bar3 i{flex:1;height:.8cqw;border-radius:1cqw;background:currentColor;opacity:.25}
.sl .bar3 i.on{opacity:.95}
.sl .eb{font-family:var(--f-mono);font-size:3.2cqw;letter-spacing:.06em;text-transform:uppercase;opacity:.65}
.sl h2{margin:0;font-weight:400;font-size:9.6cqw;line-height:1.02;letter-spacing:-.035em;text-wrap:balance}
.sl h2 em{font-family:var(--f-serif);font-style:italic;font-weight:400;opacity:.7}
.sl p{margin:0;font-size:4.6cqw;line-height:1.35;opacity:.85}
.sl .proof{border:1px solid currentColor;border-color:color-mix(in srgb,currentColor 25%,transparent);border-radius:3cqw;padding:5cqw;display:grid;gap:2cqw}
.sl .proof b{font-size:13cqw;font-weight:300;letter-spacing:-.04em;line-height:1}
.sl .cta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:4cqw 5cqw;border-radius:3cqw;font-weight:600;font-size:4.4cqw}
.sl .poll{display:grid;gap:2.4cqw;margin-top:auto}
.sl .poll span{padding:3.4cqw 4cqw;border-radius:2.4cqw;font-size:4.2cqw;font-weight:500}
.sl .list{display:grid;gap:3cqw;font-size:4.6cqw}
.sl .list div{display:grid;grid-template-columns:7cqw 1fr;gap:2cqw}
.sl .handle{margin-top:auto;display:flex;align-items:center;gap:2.4cqw;font-size:3.6cqw;opacity:.8}
.sl .handle i{width:6cqw;height:6cqw;border-radius:50%;background:currentColor;opacity:.3}
.panel{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12px;color:var(--muted);font-weight:500}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface)}
textarea.inp{resize:vertical;min-height:72px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.sw button[aria-pressed="true"]{border-color:var(--fg)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.seg button{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12.5px}
.seg button[aria-pressed="true"]{border-color:var(--fg);background:var(--accent-soft);font-weight:500}

/* library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.li{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.li .th{aspect-ratio:4/5;position:relative;display:flex;align-items:flex-end;padding:12px;color:#fff}
.li .th.sq{aspect-ratio:16/10}
.li .th b{font-weight:500;font-size:15px;line-height:1.25;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.li .bd{padding:12px;display:flex;flex-direction:column;gap:8px}
.li .bd .m{display:flex;gap:6px;flex-wrap:wrap}

/* brain */
.meter{display:flex;align-items:center;gap:12px}
.meter .bar{flex:1;height:6px;margin:0}
.bsec{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:18px 0;border-top:1px solid var(--line)}
.bsec:first-child{border-top:0;padding-top:0}
.bsec h4{margin:0;font-weight:500}
.bsec .g2{gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;background:var(--sunk);margin:0 6px 6px 0}

/* assistant */
.chat{display:flex;flex-direction:column;gap:14px;min-height:420px}
.msg{max-width:min(680px,92%);padding:12px 14px;border-radius:14px;line-height:1.55}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a ul{margin:6px 0 0;padding-left:18px}
.msg .src{margin-top:8px;font-size:12px;color:var(--muted)}
.composer{display:flex;gap:8px;padding:8px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface)}
.composer input{flex:1;border:0;background:none;padding:6px 10px;outline:none}
.sugg{display:flex;gap:8px;flex-wrap:wrap}
.sugg button{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px;color:var(--fg-2)}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,17,28,.45);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.ov[hidden]{display:none!important}
.modal{width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);overflow:hidden}
.modal .mi{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal .mi input{flex:1;border:0;background:none;outline:none;font-size:16px}
.res{max-height:50vh;overflow:auto;padding:8px}
.res .rg{padding:8px 10px 4px}
.res button{display:flex;width:100%;gap:10px;align-items:center;padding:9px 10px;border:0;background:none;border-radius:8px;text-align:left}
.res button:hover,.res button.act{background:var(--sunk)}
.res button span:last-child{margin-left:auto}
.menu{position:absolute;z-index:40;min-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 50px -20px rgba(0,0,0,.4);padding:6px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;background:none;border-radius:8px;text-align:left}
.menu button:hover{background:var(--sunk)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}

.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:12px}
.funnel{display:grid;gap:10px}
.fr{display:grid;grid-template-columns:130px minmax(0,1fr) 90px;gap:12px;align-items:center}
.fr .fb{height:30px;background:var(--sunk);border-radius:6px;overflow:hidden}
.fr .fb i{display:block;height:100%;background:var(--accent);border-radius:6px}
.fr .conv{font-size:12px;color:var(--muted);text-align:right}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.studio{grid-template-columns:minmax(0,1fr) 260px}.studio .slides{grid-column:1/-1;flex-direction:row;overflow-x:auto}.sthumb{min-width:170px}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:45;transform:translateX(-102%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.35)}
  .burger{display:grid}
  .top{padding:10px 16px}
  .top .demo span{display:none}
  .page{padding:20px 16px}
  .g3,.g2,.g21,.g12{grid-template-columns:1fr}
  .studio{grid-template-columns:1fr}
  .bsec{grid-template-columns:1fr;gap:10px}
  .search .kbd{display:none}
}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.ph h1{font-size:26px}.fr{grid-template-columns:96px minmax(0,1fr) 70px}.kpi .v{font-size:24px}}
/* ember overrides */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(42% 55% at -4% 46%,var(--glow) 0%,transparent 70%),
  radial-gradient(70% 70% at 30% 75%,var(--glow-2) 0%,transparent 75%),
  radial-gradient(50% 40% at 100% 0%,var(--glow-2) 0%,transparent 70%)}
body{isolation:isolate}
.mono{text-transform:none;letter-spacing:0;font-size:12px;font-weight:500}
em.s{font-style:normal;color:var(--accent);font-size:1em}
.side{background:var(--surface);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-right-color:var(--line)}
.top{background:transparent;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card,.kc,.li,.sthumb,.insight,.stage,.col,.msg.a,.composer,.search,.ibtn,.btn,.inp,.chips,.credit,.brandsw{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card{border-radius:22px;box-shadow:var(--shadow)}
.insight,.col,.stage{border-radius:18px}
.kc,.li,.sthumb{border-radius:14px}
.btn{padding:9px 18px;border-color:var(--line-2);background:var(--surface)}
.btn.pri{background:linear-gradient(135deg,var(--accent) 0%,#FF8A4F 100%);border-color:transparent;box-shadow:0 10px 26px -12px rgba(255,109,41,.8)}
.inp{border-radius:12px;background:var(--sunk)}
.seg button,.nav button{border-radius:999px}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.nav button[aria-current="page"] svg{color:var(--accent);opacity:1}
.ph h1{font-weight:400;font-size:40px;letter-spacing:-.045em;background:linear-gradient(90deg,var(--fg) 0%,var(--fg) 35%,var(--accent-2) 75%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
.kpi .v{font-weight:400;letter-spacing:-.04em}
.demo{border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.demo i{box-shadow:0 0 10px var(--accent)}
.modal,.menu{background:var(--solid)}
.ov{background:rgba(10,7,6,.55);backdrop-filter:blur(6px)}
.toast{background:var(--solid);color:var(--fg);border:1px solid var(--line-2)}
.toast::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px}
.cal .d{background:transparent}.cal .d.o{background:var(--sunk)}
.av{background:linear-gradient(135deg,var(--accent),#B9471A);color:#fff}
.msg.u{background:linear-gradient(135deg,var(--accent),#FF8A4F)}
.tbl th{font-size:11.5px}
svg text{font-size:10.5px}
.sw button[aria-pressed="true"],.seg button[aria-pressed="true"],.sthumb[aria-current="true"]{border-color:var(--accent)}
.chips button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);box-shadow:none}
.col.over{border-color:var(--accent)}
.nav .grp{color:var(--muted)}
@media (max-width:520px){.ph h1{font-size:30px}}
/* ===== ext-account: Auth, Onboarding, Verbindungen, Abo, Profil ===== */
.acc-auth{position:fixed;inset:0;z-index:55;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  background:radial-gradient(42% 55% at -4% 46%,var(--glow) 0%,transparent 70%),radial-gradient(70% 70% at 30% 75%,var(--glow-2) 0%,transparent 75%),radial-gradient(50% 40% at 100% 0%,var(--glow-2) 0%,transparent 70%),var(--bg);background-attachment:fixed}
.acc-auth[hidden]{display:none!important}
body.acc-lock{overflow:hidden}
.acc-wrap{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:56px;align-items:center;max-width:1120px;margin:0 auto;padding:48px 32px calc(48px + env(safe-area-inset-bottom,0px))}
.acc-wrap.ob{grid-template-columns:minmax(0,1fr);max-width:880px;align-content:start;gap:18px;padding-top:32px}
.acc-pitch{display:flex;flex-direction:column;gap:18px}
.acc-pitch .logo{padding:0;align-self:flex-start}
.acc-auth .logo small{margin-left:0}
.acc-h{margin:0;font-weight:400;font-size:52px;line-height:1.02;letter-spacing:-.045em;text-wrap:balance;background:linear-gradient(90deg,var(--fg) 0%,var(--fg) 35%,var(--accent-2) 75%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
.acc-pitch p{margin:0;color:var(--fg-2);font-size:16px;max-width:460px}
.acc-bul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px;color:var(--fg-2)}
.acc-bul li{display:flex;gap:10px;align-items:center}
.acc-bul svg{width:16px;height:16px;color:var(--accent);flex:none}
.acc-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:16px;min-width:0}
.acc-card h2{margin:0;font-weight:400;font-size:24px;letter-spacing:-.03em;line-height:1.15}
.acc-card .sub{margin:-10px 0 0;color:var(--muted)}
.acc-tabs{display:grid;grid-template-columns:1fr 1fr}
.acc-tabs button{padding:8px 12px}
.acc-social{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acc-social .btn,.acc-full{justify-content:center;width:100%}
.acc-or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}
.acc-or::before,.acc-or::after{content:"";flex:1;height:1px;background:var(--line)}
.acc-form{display:flex;flex-direction:column;gap:14px}
.acc-err{color:var(--bad);font-size:12px;min-height:0}
.acc-err:empty{display:none}
.inp[aria-invalid="true"]{border-color:var(--bad)}
.acc-pwrow{position:relative}
.acc-pwrow .inp{padding-right:72px}
.acc-pwrow .acc-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:12px;padding:6px 8px;border-radius:999px}
.acc-pwrow .acc-eye:hover{color:var(--fg)}
.acc-pw{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:2px}
.acc-pw i{height:4px;border-radius:4px;background:var(--line)}
.acc-pw[data-lvl="1"] i:nth-child(-n+1){background:var(--bad)}
.acc-pw[data-lvl="2"] i:nth-child(-n+2){background:var(--warn)}
.acc-pw[data-lvl="3"] i:nth-child(-n+3){background:var(--good)}
.acc-pw[data-lvl="4"] i{background:var(--good)}
.acc-pwl{font-size:12px;color:var(--muted)}
.acc-check{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--fg-2);line-height:1.45}
.acc-check input{width:16px;height:16px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.acc-link{border:0;background:none;padding:0;color:var(--accent-2);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--accent-2) 40%,transparent);font-size:inherit}
.acc-link:hover{text-decoration-color:currentColor}
.acc-skip{align-self:center;font-size:13.5px}
.acc-foot{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.acc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.acc-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.acc-actions.sp{justify-content:space-between}
.acc-mlogo{display:none}

/* onboarding */
.acc-obh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.acc-obh .logo{padding:0}
.acc-prog{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.acc-prog i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),#FF8A4F);transition:width .35s ease}
.acc-stepl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;font-size:12px;color:var(--muted)}
.acc-stepl li{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-stepl li b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);font-weight:500;font-size:11px;flex:none}
.acc-stepl li.on{color:var(--fg)}
.acc-stepl li.on b{border-color:var(--accent);color:var(--accent)}
.acc-stepl li.done b{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.acc-stepl li.done b svg{width:11px;height:11px}
.acc-roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.acc-opt{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--sunk);transition:border-color .15s,background .15s}
.acc-opt:hover{border-color:var(--line-2)}
.acc-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.acc-opt .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.acc-opt[aria-pressed="true"] .ic{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.acc-opt .ic svg{width:18px;height:18px}
.acc-opt b{font-weight:500;font-size:15px}
.acc-opt span.d{font-size:12.5px;color:var(--muted);line-height:1.4}
.acc-picks{display:flex;flex-wrap:wrap;gap:8px}
.acc-pick{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);color:var(--fg-2);font-size:13.5px}
.acc-pick svg{width:13px;height:13px;display:none}
.acc-pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg);font-weight:500}
.acc-pick[aria-pressed="true"] svg{display:block;color:var(--accent)}
.acc-range{display:flex;align-items:center;gap:14px}
.acc-range input[type=range]{flex:1;accent-color:var(--accent)}
.acc-range .inp{width:110px;text-align:right}
.acc-big{font-size:34px;font-weight:400;letter-spacing:-.04em;line-height:1}
.acc-hint{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--sunk);border:1px solid var(--line);font-size:12.5px;color:var(--fg-2)}
.acc-hint svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--accent)}
.acc-hint.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.acc-hint.warn svg{color:currentColor}
.acc-hint.good{background:var(--good-bg);border-color:transparent;color:var(--good)}
.acc-hint.good svg{color:currentColor}

/* integration tiles */
.acc-logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:14px;letter-spacing:-.01em;color:var(--fg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.acc-logo svg{width:22px;height:22px}
.acc-logo.on{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 3px var(--accent-soft)}
.acc-logo.me{background:linear-gradient(135deg,var(--accent),#FF8A4F);border-color:transparent;color:var(--on-accent)}
.acc-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.acc-tile{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--sunk)}
.acc-tile.on{border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.acc-tile .h{display:flex;align-items:center;gap:10px;min-width:0}
.acc-tile .h b{font-weight:500;display:block}
.acc-tile .h>div span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-tile .h>div{min-width:0}
.acc-tile .btn{justify-content:center}
.acc-ints{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.acc-int{display:flex;flex-direction:column;gap:12px}
.acc-int .h{display:flex;align-items:center;gap:12px}
.acc-int .h>div{flex:1;min-width:0}
.acc-int .h b{display:block;font-weight:500;font-size:15px}
.acc-int .h small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-int p{margin:0;color:var(--fg-2);font-size:13px;line-height:1.45}
.acc-data{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted)}
.acc-data svg{width:13px;height:13px;flex:none;margin-top:2px}
.acc-int .f{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.acc-int .f .muted{font-size:12px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-int.soon{opacity:.72}
.acc-filter{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;max-width:100%;align-self:flex-start}
.acc-filter::-webkit-scrollbar{display:none}
.acc-filter button{white-space:nowrap}
.acc-filter button small{color:var(--muted);margin-left:4px;font-size:11.5px}
.acc-key{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--sunk);min-width:0}
.acc-key code{flex:1;min-width:0;font-family:var(--f-ui);font-size:13px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.acc-key .btn{padding:6px 12px}

/* overlays: OAuth, checkout, manage drawer */
.ov.acc-ov{z-index:58;align-items:center;padding:16px;overflow-y:auto}
.ov.acc-ov.right{justify-content:flex-end;align-items:stretch;padding:0;overflow:hidden}
.acc-modal{width:min(480px,100%);padding:24px;display:flex;flex-direction:column;gap:16px;margin:auto;border-radius:22px;overflow:visible}
.acc-modal h2{margin:0;font-weight:400;font-size:21px;letter-spacing:-.03em;line-height:1.2;text-align:center;text-wrap:balance}
.acc-modal .c{text-align:center;color:var(--muted);margin:-6px 0 0;font-size:13px}
.acc-oah{display:flex;align-items:center;justify-content:center;gap:12px;padding-top:4px}
.acc-oah .acc-logo{width:52px;height:52px;border-radius:16px;font-size:18px}
.acc-dots{display:flex;gap:4px}
.acc-dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.acc-dots i:nth-child(2){animation-delay:.2s}.acc-dots i:nth-child(3){animation-delay:.4s}
.acc-perms{list-style:none;margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--sunk);display:grid;gap:9px}
.acc-perms li{display:flex;gap:10px;font-size:13px;color:var(--fg-2)}
.acc-perms svg{width:14px;height:14px;color:var(--good);flex:none;margin-top:3px}
.acc-sim{align-self:center}
.acc-spin{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:accspin .8s linear infinite;flex:none;display:inline-block}
.acc-spin.lg{width:44px;height:44px;border-width:3px}
.btn .acc-spin{width:14px;height:14px}
@keyframes accspin{to{transform:rotate(360deg)}}
.acc-state{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0 6px;text-align:center}
.acc-okc{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--good-bg);color:var(--good)}
.acc-okc svg{width:26px;height:26px}
.acc-drawer{width:min(460px,100%);height:100%;max-height:100dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--solid);border-left:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow);animation:accin .22s ease}
@keyframes accin{from{transform:translateX(24px);opacity:0}}
.acc-drawer .dh{display:flex;align-items:center;gap:12px}
.acc-drawer .dh>div{flex:1;min-width:0}
.acc-drawer .dh h2{margin:0;font-weight:400;font-size:22px;letter-spacing:-.03em}
.acc-sec{display:flex;flex-direction:column;gap:10px}
.acc-sec>h4{margin:0;font-size:12px;font-weight:500;color:var(--muted)}
.acc-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;font-size:13px}
.acc-dl dt{color:var(--muted)}
.acc-dl dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.acc-x{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--surface);flex:none}
.acc-x svg{width:15px;height:15px}

/* toggles */
.acc-sw{position:relative;width:40px;height:22px;flex:none;padding:0;border-radius:999px;border:1px solid var(--line-2);background:var(--sunk);transition:background .15s}
.acc-sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.acc-sw[aria-checked="true"]{background:var(--accent);border-color:transparent}
.acc-sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--on-accent)}
.acc-tg{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.acc-tg:last-child{border-bottom:0}
.acc-tg>span{min-width:0}
.acc-tg b{font-weight:500;display:block}
.acc-tg small{display:block;color:var(--muted);font-size:12px}

/* plans */
.acc-plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.acc-plan{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--sunk);text-align:left}
.acc-plan.pop{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:linear-gradient(160deg,var(--accent-soft),transparent 60%),var(--sunk)}
.acc-plan.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.acc-plan.cur{border-color:var(--line-2)}
.acc-plan h3{margin:0;font-weight:500;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acc-price{font-size:30px;font-weight:400;letter-spacing:-.04em;line-height:1}
.acc-price span{font-size:13px;color:var(--muted);letter-spacing:0;margin-left:3px}
.acc-plan .sm{font-size:12px;color:var(--muted);margin-top:-6px;min-height:18px}
.acc-plan ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:12.5px;color:var(--fg-2)}
.acc-plan li{display:flex;gap:8px}
.acc-plan li svg{width:13px;height:13px;color:var(--accent);flex:none;margin-top:3px}
.acc-plan .btn{margin-top:auto;justify-content:center}
.acc-badge{position:absolute;top:-10px;right:14px;padding:2px 10px;border-radius:999px;background:linear-gradient(135deg,var(--accent),#FF8A4F);color:var(--on-accent);font-size:11px;font-weight:600}
.acc-save{color:var(--good);font-size:11.5px;margin-left:4px}

/* billing & profile */
.acc-banner{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft);flex-wrap:wrap}
.acc-banner>svg{width:18px;height:18px;color:var(--accent);flex:none}
.acc-banner>div{flex:1;min-width:200px}
.acc-banner b{font-weight:500}
.acc-cur{display:flex;flex-direction:column;gap:14px}
.acc-cur .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.acc-cur .big b{font-size:34px;font-weight:400;letter-spacing:-.04em;line-height:1}
.acc-meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.acc-meter{display:flex;flex-direction:column;gap:4px}
.acc-meter .v{font-size:20px;letter-spacing:-.03em}
.acc-meter .v span{font-size:13px;color:var(--muted);letter-spacing:0}
.acc-meter .bar{height:6px}
.acc-meter.over .bar i{background:var(--bad)}
.acc-confirm{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:18px;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);background:var(--accent-soft)}
.acc-confirm h3{margin:0;font-weight:500;font-size:15px}
.acc-confirm p{margin:0;color:var(--fg-2);font-size:13px}
.acc-confirm.danger{border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:var(--bad-bg)}
.btn.acc-bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.acc-bad:hover{border-color:var(--bad)}
.btn.acc-badpri{background:var(--bad);border-color:transparent;color:var(--bg)}
.acc-sum{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--sunk);font-size:13px}
.acc-sum div{display:flex;justify-content:space-between;gap:12px}
.acc-sum .tot{padding-top:8px;border-top:1px solid var(--line);font-weight:500;font-size:14px}
.acc-pay{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line-2);border-radius:14px;background:var(--sunk)}
.acc-pay.sel{border-color:var(--accent)}
.acc-pay input{accent-color:var(--accent);margin:0}
.acc-cc{width:46px;height:30px;border-radius:7px;flex:none;background:linear-gradient(135deg,#FF6D29,#FF8A4F);position:relative}
.acc-cc::after{content:"";position:absolute;left:7px;top:9px;width:10px;height:8px;border-radius:2px;background:var(--on-accent);opacity:.7}
.acc-packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.acc-pack{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--sunk)}
.acc-pack .btn{margin-top:8px;justify-content:center}
.acc-radios{display:grid;gap:8px}
.acc-radio{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-size:13px}
.acc-radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.acc-radio input{accent-color:var(--accent);margin:0}
.acc-offer{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.acc-offer>div{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.acc-offer b{font-weight:500}
.acc-offer p{font-size:12.5px}
.acc-offer .btn{align-self:flex-start;margin-top:auto}
.acc-avbtn{padding:0;overflow:hidden;border-color:var(--line-2)}
.acc-avbtn .av{width:100%;height:100%;font-size:11.5px}
.acc-mh{display:flex;align-items:center;gap:10px;padding:8px}
.acc-mh b{font-weight:500}
.acc-mh .muted{font-size:12px}
.acc-menu button svg{width:16px;height:16px;flex:none;opacity:.85}
.acc-menu button .tag{margin-left:auto}
.acc-ph{display:flex;align-items:center;gap:16px}
.acc-ph .av{width:56px;height:56px;font-size:18px}
.acc-sess{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.acc-sess:last-child{border-bottom:0}
.acc-sess .acc-logo{width:34px;height:34px;border-radius:10px}
.acc-sess .acc-logo svg{width:16px;height:16px}
.acc-sess b{font-weight:500;display:block}
.acc-sess small{color:var(--muted);font-size:12px}

/* finish */
.acc-fin{align-items:center;text-align:center;padding:40px 28px;gap:18px}
.acc-fin .acc-h{font-size:44px}
.acc-mark{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:var(--accent);box-shadow:0 0 60px -6px var(--glow)}
.acc-mark svg{width:64px;height:64px}
.acc-run{list-style:none;margin:0;padding:0;display:grid;gap:4px;width:min(460px,100%);text-align:left}
.acc-run li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--faint);transition:color .2s,background .2s}
.acc-run li .s{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center}
.acc-run li.run{color:var(--fg);background:var(--sunk)}
.acc-run li.run .s{border-color:var(--line-2);border-top-color:var(--accent);animation:accspin .8s linear infinite}
.acc-run li.ok{color:var(--fg-2)}
.acc-run li.ok .s{background:var(--good-bg);border-color:transparent;color:var(--good)}
.acc-run li .s svg{width:11px;height:11px;display:none}
.acc-run li.ok .s svg{display:block}

@media (max-width:1100px){.acc-plans{grid-template-columns:repeat(2,minmax(0,1fr))}.acc-meters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:960px){
  .acc-wrap{grid-template-columns:minmax(0,1fr);gap:24px;padding:28px 20px 40px;max-width:560px}
  .acc-wrap.ob{max-width:880px}
  .acc-pitch{gap:12px}
  .acc-h{font-size:38px}
  .acc-pitch .acc-bul{display:none}
  .acc-roles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .acc-stepl li span{display:none}
  .acc-stepl{grid-template-columns:repeat(5,auto);justify-content:space-between}
  .acc-offer,.acc-packs{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .acc-wrap{padding:20px 16px 36px}
  .acc-card{padding:20px;border-radius:20px}
  .acc-h{font-size:32px}
  .acc-fin .acc-h{font-size:32px}
  .acc-pitch p{font-size:14.5px}
  .acc-social{grid-template-columns:minmax(0,1fr)}
  .acc-plans{grid-template-columns:minmax(0,1fr)}
  .acc-roles{gap:8px}
  .acc-opt{padding:12px}
  .acc-meters{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
  .acc-modal{padding:20px}
  .acc-drawer{padding:18px 16px}
  .acc-range .inp{width:90px}
  .acc-int .f{flex-wrap:wrap}
}
/* layout guards: grid items may shrink; top bar fits 390px (also fixes a pre-existing overflow) */
.grid>*{min-width:0}
.top .search{min-width:0}
@media (max-width:520px){
  .top{gap:8px}
  .top .r{gap:6px}
  .top .search{padding:7px 10px}
  .acc-tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .acc-tile{padding:12px}
}

/* ===== Growth extension: DM Autopilot, Trend-Radar, Repurpose, CEO Report ===== */
.side{overflow-y:auto;scrollbar-width:none}
.search{min-width:0} /* fixes pre-existing 390px top-bar overflow */
.side::-webkit-scrollbar{display:none}
.gr-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gr-sp{flex:1}
.gr-small{font-size:12.5px}
.gr-xs{font-size:11.5px}
.gr-eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--accent-2);font-size:12px;font-weight:500}
.gr-eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.gr-badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:600;line-height:1}

/* flow steps header */
.gr-hero{display:flex;flex-direction:column;gap:14px;background:linear-gradient(120deg,var(--accent-soft),transparent 55%),var(--surface)}
.gr-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;counter-reset:grs}
.gr-step{position:relative;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--sunk)}
.gr-step b{display:block;font-weight:500}
.gr-step span{font-size:12.5px;color:var(--muted)}
.gr-step .gr-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent-2)}
.gr-step .gr-ic svg{width:15px;height:15px}
.gr-step:not(:last-child)::after{content:"";position:absolute;right:-9px;top:50%;width:8px;height:8px;border-top:1.5px solid var(--accent);border-right:1.5px solid var(--accent);transform:translateY(-50%) rotate(45deg);z-index:1}
.gr-note{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted)}
.gr-note svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--accent-2)}

/* kpi rows */
.gr-k5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.gr-k5 .card{padding:16px}
.gr-k5 .kpi .v{font-size:26px}
.gr-kl{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}

/* switch */
.gr-sw{position:relative;width:38px;height:22px;flex:none;border-radius:999px;border:1px solid var(--line-2);background:var(--sunk);padding:0;transition:background .15s}
.gr-sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.gr-sw[aria-checked="true"]{background:linear-gradient(135deg,#FF6D29,#FF8A4F);border-color:transparent}
.gr-sw[aria-checked="true"] i{transform:translateX(16px);background:var(--on-accent)}

/* automation cards */
.gr-autos{display:grid;gap:12px}
.gr-auto{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.6fr) auto;gap:18px;align-items:center}
.gr-auto.off{opacity:.72}
.gr-auto .gr-t{display:flex;gap:12px;align-items:flex-start;min-width:0}
.gr-auto .gr-t b{font-weight:500;font-size:15px}
.gr-auto .gr-t .muted{font-size:12.5px}
.gr-aic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--line)}
.gr-aic svg{width:16px;height:16px}
.gr-chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px}
.gr-chain .tag{font-size:11px}
.gr-chain .gr-ar{color:var(--faint);font-size:11px}
.gr-st{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.gr-st div{display:flex;flex-direction:column;gap:2px;min-width:0}
.gr-st b{font-weight:500;font-size:17px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gr-st span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr-ctl{display:flex;gap:10px;align-items:center}
.gr-meta{grid-column:1/-1;margin-top:-4px}

/* builder */
.gr-builder{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.gr-flow{display:flex;flex-direction:column;gap:0}
.gr-node{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding-bottom:18px}
.gr-node:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:linear-gradient(var(--accent),var(--line-2))}
.gr-node .gr-nic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--solid);border:1px solid var(--line-2);color:var(--accent-2);position:relative;z-index:1}
.gr-node .gr-nic svg{width:17px;height:17px}
.gr-node.trig .gr-nic{background:linear-gradient(135deg,#FF6D29,#FF8A4F);color:var(--on-accent);border-color:transparent;box-shadow:0 8px 22px -10px var(--accent)}
.gr-nb{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.gr-nb .gr-nh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.gr-nb .gr-nh b{font-weight:500}
.gr-nb .g2{gap:10px}
.gr-vars{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gr-vars button{padding:3px 9px;border:1px dashed var(--line-2);border-radius:999px;background:var(--sunk);font-size:12px;color:var(--fg-2)}
.gr-vars button:hover{border-color:var(--accent);color:var(--fg)}
.gr-branch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gr-branch div{padding:9px 11px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:12.5px}
.gr-branch div b{font-weight:500;display:block;font-size:11.5px;margin-bottom:2px}
.gr-branch .y b{color:var(--good)}
.gr-branch .n b{color:var(--muted)}
.gr-add{display:flex;align-items:center;gap:8px;margin-left:54px;padding:10px 14px;border:1px dashed var(--line-2);border-radius:14px;background:none;color:var(--muted);font-size:13px;width:calc(100% - 54px)}
.gr-add:hover{border-color:var(--accent);color:var(--fg)}
.gr-add svg{width:14px;height:14px}
.gr-side{position:sticky;top:84px;display:flex;flex-direction:column;gap:12px;align-items:center}

/* phone (DM preview + WhatsApp preview) */
.gr-phone{width:300px;max-width:100%;border-radius:38px;padding:9px;background:var(--solid);border:1px solid var(--line-2);box-shadow:var(--shadow)}
.gr-scr{border-radius:30px;overflow:hidden;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;min-height:540px}
.gr-ph-hd{display:flex;align-items:center;gap:9px;padding:16px 14px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.gr-ph-hd .av{width:30px;height:30px}
.gr-ph-hd b{display:block;font-weight:500;font-size:13px;line-height:1.2}
.gr-ph-hd span{font-size:11px;color:var(--muted)}
.gr-notch{width:84px;height:5px;border-radius:999px;background:var(--line-2);margin:0 auto 6px}
.gr-thread{flex:1;display:flex;flex-direction:column;gap:7px;padding:12px;font-size:12.5px;line-height:1.42}
.gr-b{max-width:84%;padding:8px 11px;border-radius:18px;white-space:pre-line;overflow-wrap:anywhere}
.gr-b.out{align-self:flex-end;background:linear-gradient(135deg,#FF6D29,#FF8A4F);color:var(--on-accent);border-bottom-right-radius:6px}
.gr-b.in{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.gr-b u{text-decoration:underline;text-underline-offset:2px}
.gr-sys{align-self:center;text-align:center;font-size:10.5px;color:var(--muted);padding:2px 10px;max-width:92%}
.gr-qr{align-self:flex-end;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:92%}
.gr-qr span{padding:4px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent-2);font-size:11px}
.gr-lc{align-self:flex-end;width:78%;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--surface)}
.gr-lc i{display:block;height:46px;background:radial-gradient(80% 120% at 0% 50%,#FF6D29,transparent 70%),var(--sunk)}
.gr-lc div{padding:7px 10px;font-size:11.5px}
.gr-lc b{display:block;font-weight:500}
.gr-ph-in{display:flex;align-items:center;gap:8px;margin:0 10px 12px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--faint);font-size:12px}

/* inbox */
.gr-convo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.gr-convo.sent{opacity:.8}
.gr-who{display:flex;gap:10px;align-items:flex-start;min-width:0}
.gr-who b{font-weight:500}
.gr-quote{margin-top:6px;padding:8px 11px;border-radius:14px 14px 14px 4px;background:var(--sunk);border:1px solid var(--line);font-size:13px}
.gr-why{margin-top:6px;font-size:11.5px;color:var(--muted)}
.gr-sugg{padding:12px;border-radius:16px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft);display:flex;flex-direction:column;gap:10px}
.gr-sugg p{margin:0;font-size:13px}
.gr-sugg .gr-lbl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--accent-2);font-weight:500}
.gr-sugg .gr-lbl svg{width:13px;height:13px}
.gr-score{font-variant-numeric:tabular-nums}

/* trend radar */
.gr-trends{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.gr-tr{display:flex;flex-direction:column;gap:12px}
.gr-tr h3{font-size:17px!important;font-weight:400!important;letter-spacing:-.02em;line-height:1.25}
.gr-gr{font-size:24px;font-weight:400;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.gr-gr.up{background:none;color:var(--good)}
.gr-gr.dn{background:none;color:var(--bad)}
.gr-struct{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.gr-struct span{padding:3px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);font-size:12px}
.gr-struct i{font-style:normal;color:var(--faint);font-size:11px}
.gr-hook{padding:10px 12px;border-left:2px solid var(--accent);background:var(--sunk);border-radius:0 12px 12px 0;font-size:13.5px}
.gr-tr .spark{height:40px}
.gr-tr .gr-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:4px}
.tbl tr.gr-me td{background:var(--accent-soft)}
.tbl tr.gr-me td:first-child{border-radius:10px 0 0 10px}
.tbl tr.gr-me td:last-child{border-radius:0 10px 10px 0}
.gr-addc{display:flex;gap:8px;flex-wrap:wrap}
.gr-addc .inp{flex:1;min-width:180px}
.gr-x{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);display:inline-grid;place-items:center}
.gr-x:hover{color:var(--bad);border-color:var(--bad)}
.gr-x svg{width:12px;height:12px}

/* benchmarks */
.gr-pct{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.gr-ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;position:relative}
.gr-ring b{font-size:34px;font-weight:400;letter-spacing:-.04em;line-height:1}
.gr-ring span{font-size:11px;color:var(--muted)}
.gr-ring div{text-align:center}
.gr-pct h2{margin:0;font-weight:400;font-size:24px;letter-spacing:-.03em;line-height:1.2;text-wrap:balance}
.gr-bm{display:grid;grid-template-columns:200px minmax(0,1fr) 150px;gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.gr-bm:last-child{border-bottom:0}
.gr-bm b{font-weight:500}
.gr-track{position:relative;height:34px}
.gr-track .gr-bar{position:absolute;left:0;height:9px;border-radius:999px}
.gr-track .gr-you{top:6px;background:linear-gradient(90deg,#FF6D29,#FF8A4F);box-shadow:0 0 14px -2px var(--accent)}
.gr-track .gr-avg{top:20px;background:var(--chart-2);opacity:.45}
.gr-track .gr-base{position:absolute;left:0;right:0;top:15px;height:1px;background:var(--line)}
.gr-track .gr-top{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--line-2)}
.gr-track .gr-top span{position:absolute;top:-2px;left:5px;font-size:10px;color:var(--muted);white-space:nowrap}
.gr-bmv{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.gr-bmv .num{font-size:13px}
.gr-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.gr-legend i{display:inline-block;width:16px;height:6px;border-radius:999px;margin-right:6px;vertical-align:1px}

/* repurpose */
.gr-rp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr);gap:22px}
.gr-rp h4{margin:0 0 10px;font-weight:500;font-size:13px;display:flex;align-items:center;gap:8px}
.gr-rp h4 span{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:var(--accent-soft);color:var(--accent-2);font-size:11px}
.gr-src{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--sunk)}
.gr-src .gr-thumb{width:64px;aspect-ratio:9/16;border-radius:10px;background:radial-gradient(90% 60% at 0% 45%,#FF6D29 0%,var(--solid) 80%);display:flex;align-items:flex-end;justify-content:flex-end;padding:4px;font-size:10px;color:var(--on-accent)}
.gr-src b{font-weight:500;font-size:13px;line-height:1.3;display:block}
.gr-or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;margin:10px 0}
.gr-or::before,.gr-or::after{content:"";flex:1;height:1px;background:var(--line)}
.gr-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gr-opt{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:14px;background:var(--sunk);text-align:left;font-size:13px;min-width:0}
.gr-opt .gr-cb{width:17px;height:17px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.gr-opt .gr-cb svg{width:11px;height:11px;opacity:0}
.gr-opt[aria-pressed="true"]{border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:var(--accent-soft)}
.gr-opt[aria-pressed="true"] .gr-cb{background:linear-gradient(135deg,#FF6D29,#FF8A4F);border-color:transparent;color:var(--on-accent)}
.gr-opt[aria-pressed="true"] .gr-cb svg{opacity:1}
.gr-opt .gr-on{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr-opt .gr-cr{font-size:11px;color:var(--muted);white-space:nowrap}
.gr-langs{display:flex;flex-wrap:wrap;gap:6px}
.gr-langs button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);font-size:12.5px;color:var(--fg-2)}
.gr-langs button[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 60%,transparent);color:var(--fg);font-weight:500}
.gr-langs button.gr-more{border-style:dashed;color:var(--muted)}
.gr-gen{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.gr-res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.gr-out{display:flex;flex-direction:column;gap:12px;min-width:0}
.gr-out .chips button{padding:4px 10px;font-size:12px}
.gr-prev{max-height:300px;overflow:auto;padding:14px;border-radius:16px;background:var(--sunk);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.5}
.gr-prev p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.gr-pb{display:flex;flex-direction:column;gap:3px}
.gr-pb .mono{color:var(--accent-2)}
.gr-prev[dir="rtl"] .gr-pb{text-align:right}
.gr-acts{display:flex;gap:8px;flex-wrap:wrap}
.gr-acts .btn{padding:7px 14px}

/* CEO report */
.gr-rep{position:relative;overflow:hidden;padding:30px;display:flex;flex-direction:column;gap:26px}
.gr-rep::before{content:"";position:absolute;inset:-40% -10% auto auto;width:60%;height:120%;background:radial-gradient(closest-side,var(--accent-soft),transparent);pointer-events:none}
.gr-rep > *{position:relative}
.gr-lead{margin:0;font-size:22px;font-weight:400;letter-spacing:-.025em;line-height:1.35;max-width:62ch;text-wrap:pretty}
.gr-lead b{font-weight:500;color:var(--accent-2)}
.gr-big{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--sunk)}
.gr-big div{padding:16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.gr-big div:last-child{border-right:0}
.gr-big .delta{align-self:flex-start}
.gr-big .v{font-size:30px;font-weight:400;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.gr-big .v.acc{background:linear-gradient(90deg,var(--fg),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.gr-sec h3{margin:0 0 12px;font-size:12px!important;font-weight:500;color:var(--muted)}
.gr-li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.gr-li:last-child{border-bottom:0}
.gr-li .gr-d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px}
.gr-li .gr-d svg{width:12px;height:12px}
.gr-li.good .gr-d{background:var(--good-bg);color:var(--good)}
.gr-li.bad .gr-d{background:var(--bad-bg);color:var(--bad)}
.gr-li p{margin:0}
.gr-li .src{font-size:12px;color:var(--muted);margin-top:3px}
.gr-recs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gr-rec{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--sunk)}
.gr-rec .gr-n{font-size:28px;font-weight:300;letter-spacing:-.04em;line-height:1;background:linear-gradient(135deg,#FF6D29,#FF8A4F);-webkit-background-clip:text;background-clip:text;color:transparent}
.gr-rec b{font-weight:500;line-height:1.35}
.gr-rec p{margin:0;font-size:13px;color:var(--fg-2)}
.gr-rec .src{font-size:12px;color:var(--muted);padding-top:8px;border-top:1px solid var(--line);margin-top:auto}
.gr-rec .btn{align-self:flex-start}
.tbl tfoot td{font-weight:500;border-top:1px solid var(--line-2);border-bottom:0}
.gr-set{display:flex;flex-direction:column;gap:0}
.gr-set .gr-sr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.gr-set .gr-sr:last-child{border-bottom:0}
.gr-set .gr-sr b{font-weight:500;display:block}
.gr-set .gr-sr span{font-size:12.5px;color:var(--muted)}
.gr-wa .gr-ph-hd .av{background:linear-gradient(135deg,#FF6D29,#FF8A4F)}
.gr-wa .gr-ph-hd .av svg{width:16px;height:16px}
.gr-wa .gr-thread{background:radial-gradient(120% 60% at 0% 100%,var(--accent-soft),transparent 70%)}
.gr-wa .gr-b.in{max-width:90%;background:var(--solid);border-color:var(--line-2);font-size:12px}
.gr-wa .gr-b.in b{font-weight:600}
.gr-wa .gr-tm{display:block;text-align:right;font-size:10px;color:var(--muted);margin-top:4px}
.gr-wa .gr-day{align-self:center;font-size:10.5px;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.gr-wa .gr-open{display:block;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);color:var(--accent-2);font-weight:500;text-align:center}

@media (max-width:1180px){
  .gr-k5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .gr-auto{grid-template-columns:minmax(0,1fr) auto}
  .gr-auto .gr-st{grid-column:1/-1;grid-row:2}
  .gr-rp{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .gr-rp > :last-child{grid-column:1/-1}
  .gr-big{grid-template-columns:repeat(3,minmax(0,1fr))}
  .gr-big div:nth-child(3){border-right:0}
  .gr-big div:nth-child(-n+3){border-bottom:1px solid var(--line)}
  .gr-recs{grid-template-columns:1fr}
  .gr-builder{grid-template-columns:minmax(0,1fr) 310px}
}
@media (max-width:980px){
  .gr-builder{grid-template-columns:1fr}
  .gr-side{position:static}
  .gr-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gr-step:nth-child(2)::after{display:none}
  .gr-convo{grid-template-columns:1fr}
  .gr-trends,.gr-res{grid-template-columns:1fr}
}
@media (max-width:860px){
  .gr-rp{grid-template-columns:1fr}
  .gr-bm{grid-template-columns:minmax(0,1fr) auto;gap:8px 14px}
  .gr-bm .gr-track{grid-column:1/-1;grid-row:2}
  .gr-rep{padding:20px}
  .gr-lead{font-size:19px}
}
@media (max-width:520px){
  .gr-k5{grid-template-columns:1fr 1fr}
  .gr-k5 > :first-child{grid-column:1/-1}
  .gr-k5 .kpi .v{font-size:22px}
  .gr-steps{grid-template-columns:1fr}
  .gr-step::after{display:none}
  .gr-st{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:10px}
  .gr-auto{grid-template-columns:minmax(0,1fr);gap:14px}
  .gr-ctl{justify-content:space-between;padding-top:12px;border-top:1px solid var(--line)}
  .gr-opts{grid-template-columns:1fr}
  .gr-branch{grid-template-columns:1fr}
  .gr-pct{grid-template-columns:1fr;justify-items:start;gap:14px}
  .gr-pct h2{font-size:20px}
  .gr-big{grid-template-columns:1fr 1fr}
  .gr-big div{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .gr-big div:nth-child(2n){border-right:0}
  .gr-big div:nth-child(3){border-right:1px solid var(--line)}
  .gr-big div:first-child{grid-column:1/-1;border-right:0}
  .gr-big div:last-child{border-bottom:0}
  .gr-big .v{font-size:24px}
  .gr-node{grid-template-columns:32px minmax(0,1fr);gap:10px}
  .gr-node .gr-nic{width:32px;height:32px}
  .gr-node:not(:last-child)::before{left:15px;top:32px}
  .gr-add{margin-left:42px;width:calc(100% - 42px)}
  .gr-rep{padding:18px}
  .gr-acts{gap:6px}
  .gr-acts .btn{padding:7px 11px;font-size:12.5px}
}

.delta{white-space:nowrap}.kpi>div:first-child{flex-wrap:wrap;gap:6px}
.attr-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 14px}
.attr-step{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);font-size:12px;color:var(--fg-2)}
.attr-step.on{background:linear-gradient(135deg,#FF6D29,#FF8A4F);color:#fff;border-color:transparent}
.attr-arr{color:var(--faint);font-size:12px}
.attr-bar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.attr-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#FF6D29,#FF8A4F)}

.sw-form{display:flex;flex-wrap:wrap;gap:12px}
.sw-top a,.sw-card a.btn{text-decoration:none;color:var(--fg)}
.sw-err{margin:10px 0 0;color:var(--bad);font-size:13px}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.sw-card{display:flex;flex-direction:column;gap:12px}
.sw-top{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center}
.sw-pf{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600}
.sw-an{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--sunk)}
.sw-row{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.sw-row b{font-weight:500;text-align:right}
.sw-struct{margin:0;padding-left:18px;display:grid;gap:3px;font-size:13px;color:var(--fg-2)}
.sw-why{margin:0;font-size:13px}
.sw-an .src{font-size:12px;color:var(--muted)}
.sw-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
@media (max-width:520px){.sw-grid{grid-template-columns:1fr}}
/* ===== ext-manychat: DM Autopilot als Flow-Tool (Flows, Live-Chat, Kontakte, Growth-Tools, Vorlagen) ===== */
.mc-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mc-sp{flex:1}
.mc-xs{font-size:11.5px}
.mc-sm{font-size:12.5px}
.mc-ic{width:14px;height:14px;flex:none}
.mc-hide{display:none!important}
.mc-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.mc-lnk{border:0;background:none;padding:0;color:var(--accent-2);text-decoration:underline;text-underline-offset:2px;font:inherit;cursor:pointer}
body.mc-lock{overflow:hidden}
/* header */
.mc-comp{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--muted);margin-top:-6px}
.mc-comp svg{width:14px;height:14px;color:var(--accent-2);flex:none;margin-top:2px}
.mc-comp b{font-weight:500;color:var(--fg-2)}
.mc-comp span{flex:1;min-width:0}
.mc-chs{display:flex;gap:6px;flex-wrap:wrap}
.mc-chp{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);font-size:12px;color:var(--fg-2);white-space:nowrap}
.mc-chp i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
.mc-chp.soon{color:var(--muted)}
.mc-chp.soon i{background:var(--faint);box-shadow:none}
.mc-chp em{font-style:normal;font-size:10.5px;padding:0 6px;border-radius:999px;border:1px dashed var(--line-2)}

/* tabs */
.mc-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-top:-4px}
.mc-tabs::-webkit-scrollbar{display:none}
.mc-tab{position:relative;display:inline-flex;align-items:center;gap:7px;padding:11px 14px;border:0;background:none;color:var(--muted);font-weight:500;font-size:13.5px;white-space:nowrap;border-radius:10px 10px 0 0}
.mc-tab svg{width:15px;height:15px}
.mc-tab:hover{color:var(--fg)}
.mc-tab[aria-selected="true"]{color:var(--fg)}
.mc-tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,#FF6D29,#FF8A4F);box-shadow:0 0 12px -1px var(--accent)}
.mc-tab[aria-selected="true"] svg{color:var(--accent)}
.mc-bdg{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:600}
.mc-panel{display:flex;flex-direction:column;gap:16px;min-width:0}

/* overview */
.mc-ovg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px}
.mc-chl{display:grid;gap:8px}
.mc-chi{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:var(--sunk)}
.mc-chi .mc-lg{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--fg-2)}
.mc-chi.on .mc-lg{background:linear-gradient(135deg,#FF6D29,#FF8A4F);color:#fff;border-color:transparent}
.mc-chi b{font-weight:500;display:block}
.mc-chi.soon{opacity:.7}
.mc-rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mc-rule{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--sunk);font-size:12.5px;color:var(--fg-2)}
.mc-rule b{display:block;font-weight:500;color:var(--fg);font-size:13px;margin-bottom:2px}
.mc-rule .mc-d{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--good-bg);color:var(--good)}
.mc-rule .mc-d svg{width:13px;height:13px}
.mc-subbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* flows layout */
.mc-flows{display:grid;grid-template-columns:250px minmax(0,1fr) 320px;gap:16px;align-items:start}
.mc-fl{display:flex;flex-direction:column;gap:8px;min-width:0}
.mc-flh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 2px 2px}
.mc-flh b{font-weight:500}
.mc-fls{display:flex;flex-direction:column;gap:8px}
.mc-fi{display:flex;flex-direction:column;gap:8px;width:100%;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.mc-fi:hover{border-color:var(--line-2)}
.mc-fi[aria-current="true"]{border-color:color-mix(in srgb,var(--accent) 70%,transparent);background:linear-gradient(135deg,var(--accent-soft),transparent 70%),var(--surface);box-shadow:0 12px 30px -18px var(--accent)}
.mc-fi .mc-ft{display:flex;align-items:center;gap:8px;min-width:0}
.mc-fi .mc-ft b{font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.mc-dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
.mc-fst{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.mc-fst span{display:flex;flex-direction:column;font-size:10.5px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-fst b{font-weight:500;font-size:13px;color:var(--fg);font-variant-numeric:tabular-nums}

.mc-cvw{display:flex;flex-direction:column;gap:12px;padding:14px;min-width:0}
.mc-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mc-name{flex:1;min-width:160px;font-size:16px;font-weight:500;padding:7px 11px;border:1px solid transparent;border-radius:12px;background:none}
.mc-name:hover{border-color:var(--line)}
.mc-name:focus{border-color:var(--line-2);background:var(--sunk);outline:none}
.mc-pub{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-2);padding:4px 4px 4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--sunk)}
.mc-bar .btn{padding:7px 14px}
.mc-stl{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--fg-2);padding:0 4px}
.mc-stl b{font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.mc-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mc-stats div{padding:9px 12px;border:1px solid var(--line);border-radius:14px;background:var(--sunk);display:flex;flex-direction:column;gap:1px;min-width:0}
.mc-stats b{font-weight:500;font-size:18px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mc-stats span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mc-ai{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);background:linear-gradient(120deg,var(--accent-soft),transparent 65%),var(--sunk)}
.mc-ai .mc-air{display:flex;gap:8px;flex-wrap:wrap}
.mc-ai .mc-air .inp{flex:1;min-width:200px}
.mc-ai .sugg button{font-size:12px;padding:5px 11px}
.mc-lbl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent-2);font-weight:500}
.mc-lbl svg{width:13px;height:13px}

/* canvas */
.mc-cvb{position:relative}
.mc-cv{position:relative;height:600px;overflow:auto;border:1px solid var(--line);border-radius:18px;cursor:grab;overscroll-behavior:contain;touch-action:pan-x pan-y;
  background-color:var(--sunk);background-image:radial-gradient(color-mix(in srgb,var(--fg) 14%,transparent) 1px,transparent 1.2px);background-size:22px 22px}
.mc-cv.pan{cursor:grabbing;user-select:none}
.mc-sizer{position:relative}
.mc-world{position:absolute;left:0;top:0;transform-origin:0 0}
.mc-edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.mc-edges path{fill:none;stroke:var(--line-2);stroke-width:1.6}
.mc-edges path.on{stroke:var(--accent);stroke-width:2}
.mc-edges path.stub{stroke-dasharray:4 4}
.mc-edges circle{fill:var(--line-2)}
.mc-edges circle.on{fill:var(--accent)}
.mc-node{position:absolute;width:248px;display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:18px;background:var(--solid);box-shadow:0 18px 36px -24px rgba(0,0,0,.75);cursor:pointer;text-align:left;transition:border-color .12s,box-shadow .12s}
.mc-node:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line-2))}
.mc-node[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 20px 40px -22px var(--accent)}
.mc-node:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mc-nh{display:flex;align-items:center;gap:9px;padding:11px 12px 9px}
.mc-nh .mc-ni{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent-2)}
.mc-nh .mc-ni svg{width:15px;height:15px}
.mc-node.trig .mc-ni{background:linear-gradient(135deg,#FF6D29,#FF8A4F);color:#fff}
.mc-node.trig{border-color:color-mix(in srgb,var(--accent) 55%,var(--line-2))}
.mc-nh div{min-width:0;flex:1}
.mc-nh small{display:block;font-size:10.5px;color:var(--muted);line-height:1.2}
.mc-nh b{display:block;font-weight:500;font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-nb{padding:0 12px 12px;display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--fg-2)}
.mc-txt{padding:8px 10px;border-radius:12px;background:var(--sunk);border:1px solid var(--line);line-height:1.42;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.mc-var{color:var(--accent-2);font-weight:500}
.mc-img{height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:11.5px;border:1px dashed var(--line-2);background:radial-gradient(70% 120% at 0% 50%,var(--accent-soft),transparent 70%),var(--sunk)}
.mc-img svg{width:14px;height:14px}
.mc-nbtn{display:block;text-align:center;padding:6px 10px;border-radius:10px;border:1px solid var(--line-2);font-size:12px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-pills{display:flex;flex-wrap:wrap;gap:4px}
.mc-pills span{padding:2px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-2);font-size:11px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.mc-meta svg{width:12px;height:12px}
.mc-warn{display:flex;gap:6px;align-items:flex-start;font-size:11.5px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:6px 8px}
.mc-warn svg{width:13px;height:13px;flex:none;margin-top:1px}
.mc-ports{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.mc-port{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:12px;color:var(--fg-2)}
.mc-port+.mc-port{border-top:1px solid var(--line)}
.mc-port b{font-weight:500}
.mc-port.yes b{color:var(--good)}
.mc-port.no b{color:var(--muted)}
.mc-port i{width:9px;height:9px;border-radius:50%;border:2px solid var(--line-2);background:var(--solid);margin-right:-17px}
.mc-plus{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;display:grid;place-items:center;padding:0;border:1px solid var(--line-2);background:var(--solid);color:var(--fg-2);z-index:2;box-shadow:0 6px 14px -8px rgba(0,0,0,.6);transition:transform .12s,background .12s}
.mc-plus svg{width:12px;height:12px}
.mc-plus:hover,.mc-plus:focus-visible{background:linear-gradient(135deg,#FF6D29,#FF8A4F);color:#fff;border-color:transparent;transform:scale(1.12)}
.mc-zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--line);background:var(--solid);box-shadow:var(--shadow);z-index:3}
.mc-zoom button{width:30px;height:30px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--fg-2)}
.mc-zoom button:hover{background:var(--sunk);color:var(--fg)}
.mc-zoom svg{width:14px;height:14px}
