    else{const up=accIsUp(x.k,vc);const lbl=x.k===A.plan?(vc==='year'?'Zu jährlich wechseln':'Zu monatlich wechseln'):up?'Upgrade':'Downgrade';action=`<button class="btn ${up?'pri':''}" data-acc-change="${x.k}" data-acc-cyc="${vc}" ${A.canceled?'disabled':''}>${lbl}</button>`}
    return accPlanCard(x,vc,{cur:x.k===A.plan,action})}).join('');
  let confirm='';
  if(A.change){const np=accPlan(A.change.plan),t=accChangeText(A.change.plan,A.change.cycle);
    confirm=`<div class="acc-confirm" id="accChange" role="region" aria-label="Planwechsel bestätigen"><h3>${t.up?'Upgrade':'Wechsel'} auf ${np.n} · ${A.change.cycle==='year'?'jährlich':'monatlich'}</h3>${t.html}<div class="acc-actions"><button class="btn" data-acc-change="cancel">Abbrechen</button><button class="btn pri" data-acc-change="confirm" data-acc-autofocus ${A.busyChange?'disabled':''}>${A.busyChange?'<span class="acc-spin"></span>':''}${t.up?(t.due?`Kostenpflichtig wechseln · ${eur(t.due)}`:'Jetzt wechseln'):`Wechsel zum ${accNextDate()} planen`}</button></div></div>`}
  const inv=A.invoices.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Datum</th><th>Nummer</th><th>Leistung</th><th class="r">Betrag</th><th>Status</th><th class="r">Beleg</th></tr></thead><tbody>${A.invoices.map(x=>`<tr><td class="num">${x.d}</td><td class="num">${x.no}</td><td class="muted">${esc(x.t)}</td><td class="r num">${eur(x.a)}</td><td><span class="tag good">Bezahlt</span></td><td class="r"><button class="btn" data-toast="Rechnung ${x.no} als PDF heruntergeladen (Demo)" aria-label="Rechnung ${x.no} als PDF">PDF</button></td></tr>`).join('')}</tbody></table></div>`
    :`<div class="empty">Noch keine Rechnungen. Die erste kommt nach der Testphase am ${A.trialEnd}.</div>`;
  let cancel='';const c=A.cancel;
  if(A.canceled)cancel=`<div class="acc-confirm danger"><h3>Dein Abo endet am ${accNextDate()}</h3><p>Bis dahin hast du vollen Zugriff. Danach bleiben deine Daten 30 Tage exportierbar und werden anschließend gelöscht.</p><div class="acc-actions" style="justify-content:flex-start"><button class="btn pri" data-acc-cancel="undo">Kündigung zurücknehmen</button><button class="btn" data-toast="Export wird vorbereitet – Link kommt per E-Mail (Demo)">Daten exportieren</button></div></div>`;
  else if(!c)cancel=`<div class="acc-row"><p class="muted" style="margin:0;font-size:13px;max-width:560px">Monatlich kündbar. Du behältst Zugriff bis zum Ende des bezahlten Zeitraums, danach sind deine Daten noch 30 Tage exportierbar.</p><button class="btn acc-bad" data-acc-cancel="start">Abo kündigen</button></div>`;
  else if(c.step==='reason')cancel=`<div class="acc-confirm danger" role="region" aria-label="Kündigung"><h3>Schade. Was ist der Hauptgrund?</h3><p>Deine Antwort hilft uns, das Produkt besser zu machen.</p><div class="acc-radios" role="radiogroup" aria-label="Kündigungsgrund">${['Zu teuer','Ich nutze es zu wenig','Mir fehlt eine Funktion','Ich wechsle zu einem anderen Tool','Etwas anderes'].map(r=>`<label class="acc-radio"><input type="radio" name="accReason" value="${r}" data-acc-reason ${c.reason===r?'checked':''}>${r}</label>`).join('')}</div><div class="acc-actions"><button class="btn" data-acc-cancel="abort">Doch nicht</button><button class="btn" data-acc-cancel="next" ${c.reason?'':'disabled'}>Weiter</button></div></div>`;
  else cancel=`<div class="acc-confirm danger" role="region" aria-label="Angebot vor der Kündigung"><h3>Bevor du gehst</h3><p>${c.reason==='Zu teuer'?'Wir möchten dich halten – hier zwei Optionen:':c.reason==='Ich nutze es zu wenig'?'Wenig Zeit gerade? Pausiere statt zu kündigen – deine Daten und dein Brand Brain bleiben erhalten.':'Vielleicht passt eine dieser Optionen besser:'}</p>
    <div class="acc-offer"><div><b>${A.cycle==='year'?'50 % auf die nächste Jahresrechnung':'50 % für die nächsten 2 Monate'}</b><p class="muted" style="margin:0">${p.n} für ${eur(price*.5)} statt ${eur(price)} ${A.cycle==='year'?'im nächsten Jahr':'pro Monat'}. Danach regulär${A.cycle==='year'?'':', weiter monatlich kündbar'}.</p><button class="btn pri" data-acc-cancel="discount">Rabatt annehmen</button></div><div><b>2 Monate pausieren</b><p class="muted" style="margin:0">Keine Abbuchung, kein Sync. Am 04.01.2027 geht es automatisch weiter.</p><button class="btn" data-acc-cancel="pause">Abo pausieren</button></div></div>
    <div class="acc-actions"><button class="btn" data-acc-cancel="abort">Zurück zum Abo</button><button class="btn acc-badpri" data-acc-cancel="final">Trotzdem kündigen</button></div></div>`;
  return `<div class="ph"><div><h1>Abo & Rechnungen</h1><p>Plan, Nutzung und Rechnungen für den Workspace „Agentur Aid Muric“.</p></div><button class="btn" data-toast="Rechnungsadresse und USt-IdNr. bearbeiten (Demo)">Rechnungsdaten</button></div>
  ${A.trial&&!A.canceled?`<div class="acc-banner" role="status">${I.info}<div><b>Testphase: noch 14 Tage</b> – endet am ${A.trialEnd}. Danach ${eur(price)}/${per}${A.card?' über '+A.card.brand+' •••• '+A.card.last4:''}. Wir erinnern dich 3 Tage vorher.</div>${A.card?'':`<button class="btn pri" data-acc-addcard>Zahlungsmethode hinterlegen</button>`}</div>`:''}
  <div class="grid g21">
   <section class="card acc-cur"><div class="hd" style="margin:0"><h3>Aktueller Plan</h3>${status}</div>
    <div class="big"><b>${p.n}</b><span class="muted">${A.cycle==='year'?'jährlich':'monatlich'} · ${eur(price,0)}/${per}</span>${A.discount?`<span class="tag good">−50 % ${A.cycle==='year'?'nächstes Jahr':'für 2 Monate'}</span>`:''}</div>
    <dl class="acc-dl" style="max-width:520px"><dt>${A.canceled?'Zugriff bis':'Nächste Rechnung'}</dt><dd class="num">${accNextDate()}${A.canceled?'':` · ${eur(disc)}`}</dd><dt>Enthalten</dt><dd>${fmt(p.cr)} Credits/Monat · ${p.brands} Brand${p.brands>1?'s':''}</dd>
     ${A.pendingDown?`<dt>Geplant</dt><dd>Wechsel zu ${accPlan(A.pendingDown.plan).n} am ${accNextDate()} · <button class="acc-link" data-acc-undodown>Rückgängig</button></dd>`:''}
     ${A.paused?`<dt>Pause</dt><dd>04.11.2026 bis 04.01.2027 · <button class="acc-link" data-acc-unpause>Aufheben</button></dd>`:''}</dl>
    <div class="acc-actions" style="justify-content:flex-start"><button class="btn" data-acc-scroll="accPlans">Plan wechseln</button>${A.cycle==='month'&&p.y&&!A.canceled?`<button class="btn" data-acc-change="${A.plan}" data-acc-cyc="year">Jährlich zahlen · ${eur(p.m*12-p.y,0)} sparen</button>`:''}</div></section>
   <section class="card"><div class="hd"><h3>Zahlungsmethode</h3>${A.card?`<button class="btn" data-acc-addcard>Ändern</button>`:''}</div>
    ${A.card?`<div class="acc-pay"><span class="acc-cc" aria-hidden="true"></span><span style="flex:1"><b style="font-weight:500">${A.card.brand} •••• ${A.card.last4}</b><br><span class="muted" style="font-size:12px">läuft ab ${A.card.exp} · Standard</span></span></div>`:`<div class="empty" style="padding:18px">Noch keine Zahlungsmethode.<br><button class="btn pri" style="margin-top:10px" data-acc-addcard>Hinterlegen</button></div>`}
    <dl class="acc-dl" style="margin-top:14px"><dt>Rechnung an</dt><dd>${esc(S.acc.user.email)}</dd><dt>Firma</dt><dd>Agentur Aid Muric</dd><dt>USt-IdNr.</dt><dd class="muted">nicht hinterlegt</dd></dl></section>
  </div>
  <section class="card"><div class="hd"><h3>Nutzung</h3><span class="mono muted">Zeitraum 04.10.–03.11.2026</span></div><div class="acc-meters">${meterHtml}</div></section>
  <section class="card" id="accPlans"><div class="hd"><h3>Plan wechseln</h3><div class="chips" role="group" aria-label="Zahlweise"><button data-acc-vcycle="month" aria-pressed="${vc==='month'}">Monatlich</button><button data-acc-vcycle="year" aria-pressed="${vc==='year'}">Jährlich <span class="acc-save">2 Monate gratis</span></button></div></div>
   ${confirm?confirm+'<div style="height:16px"></div>':''}
   <div class="acc-plans">${planBtns}</div></section>
  <div class="grid g12">
   <section class="card"><div class="hd"><h3>Zusätzliche Credits</h3><span class="mono muted">verfallen nicht</span></div>
    <div class="acc-packs">${[[500,15],[2000,49]].map(([n,a])=>`<div class="acc-pack"><span class="muted" style="font-size:12.5px">${n===2000?'Bester Preis':'Einmalig'}</span><div class="acc-price num">${fmt(n)}<span>Credits</span></div><span class="muted" style="font-size:12.5px">${eur(a,0)} · ${(a/n*100).toLocaleString('de-DE',{maximumFractionDigits:2})} ct pro Credit</span><button class="btn ${n===500?'':'pri'}" data-acc-buy="${n}" data-acc-amt="${a}">Kaufen</button></div>`).join('')}</div></section>
   <section class="card"><div class="hd"><h3>Rechnungen</h3><span class="mono muted">${A.invoices.length} ${A.invoices.length===1?'Beleg':'Belege'}</span></div>${inv}</section>
  </div>
  <section class="card"><div class="hd"><h3>Abo kündigen</h3></div>${cancel}</section>`;
}

    </form></section>
   <section class="card"><div class="hd"><h3>Sicherheit</h3>${P.twofa?'<span class="tag good">2FA aktiv</span>':'<span class="tag warn">2FA aus</span>'}</div>

/* ---------- events ---------- */
function accFocusSel(sel){setTimeout(()=>{const el=document.querySelector(sel);el&&el.focus()},20)}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-acc-menu],[data-acc-nav],[data-acc-logout],[data-acc-tab],[data-acc-sso],[data-acc-skip],[data-acc-forgot],[data-acc-pwshow],[data-acc-role],[data-acc-goal],[data-acc-ob],[data-acc-obcycle],[data-acc-plan],[data-acc-connect],[data-acc-close],[data-acc-allow],[data-acc-enter],[data-acc-manage],[data-acc-notify],[data-acc-filter],[data-acc-syncnow],[data-acc-syncall],[data-acc-type],[data-acc-disc],[data-acc-apishow],[data-acc-copy],[data-acc-rotate],[data-acc-vcycle],[data-acc-change],[data-acc-undodown],[data-acc-unpause],[data-acc-scroll],[data-acc-buy],[data-acc-addcard],[data-acc-pay],[data-acc-cancel],[data-acc-pref],[data-acc-tfa],[data-acc-del]');
  if(!t){const L=document.getElementById('accLayer');if(L&&e.target===L&&ACC_L&&ACC_L.phase!=='busy')accCloseLayer();return}
  const d=t.dataset,A=S.acc;
  if('accMenu' in d){const u=A.user;const m=popMenu(t,`<div class="acc-mh"><span class="av">${esc(accInit(u.name))}</span><span style="min-width:0"><b>${esc(u.name)}</b><br><span class="muted">${esc(u.email)}</span></span></div><hr><button data-acc-nav="account">${I.user} Profil</button><button data-acc-nav="billing">${I.card} Abo & Rechnungen <span class="tag">${accPlan().n}</span></button><button data-acc-nav="connect">${I.plug} Verbindungen <span class="tag">${accConnCount()}</span></button><hr><button data-acc-logout>${I.out} Abmelden</button>`);m.classList.add('acc-menu');m.style.left=Math.max(12,Math.min(t.getBoundingClientRect().right-m.offsetWidth,innerWidth-m.offsetWidth-12))+'px';const f=m.querySelector('button');f&&f.focus();return}
  if(d.accNav){closeMenus();go(d.accNav);return}
  if('accLogout' in d)return accLogout();
  if(d.accTab){if(A.screen!==d.accTab){A.screen=d.accTab;A.err={};A.pwShow=false;if(d.accTab==='login'&&!A.form.lemail&&A.form.email)A.form.lemail=A.form.email;accAuthRender()}return}
  if(d.accSso)return accSso(d.accSso);
  if('accSkip' in d){S.acc.user={name:BRANDS[0].name,email:'aid@beispiel.de'};return accEnterApp('guest')}
  if('accForgot' in d){const m=A.form.lemail.trim();return toast(m?`Link zum Zurücksetzen an ${m} gesendet (Demo)`:'Gib zuerst deine E-Mail-Adresse ein')}
  if('accPwshow' in d){A.pwShow=!A.pwShow;accAuthRender();return accFocusSel('#accPw')}
  if(d.accRole){A.ob.role=d.accRole;A.ob.err={};if(d.accRole==='agency')A.ob.plan='agency';else if(A.ob.plan==='agency')A.ob.plan='pro';return accAuthRender()}
  if(d.accGoal){const g=A.ob.goals,i=g.indexOf(d.accGoal);i>=0?g.splice(i,1):g.push(d.accGoal);A.ob.err={};return accAuthRender()}
  if(d.accOb){if(d.accOb==='back'){A.ob.step=Math.max(1,A.ob.step-1);A.ob.err={};accAuthRender();return accFocusSel('#accAuth [data-acc-ob="back"]')}return accObNext()}
  if(d.accObcycle){A.ob.cycle=d.accObcycle;return accAuthRender()}
  if(d.accPlan){A.ob.plan=d.accPlan;return accAuthRender()}
  if(d.accConnect)return accOAuth(d.accConnect,()=>{if(A.screen==='ob'&&document.getElementById('accAuth')&&!document.getElementById('accAuth').hidden)accAuthRender();else accRender()});
  if('accClose' in d){if(ACC_L&&ACC_L.phase==='busy')return;return accCloseLayer()}
  if('accAllow' in d)return accAllow();
  if('accPay' in d)return accPay();
  if('accEnter' in d)return accEnterApp('signup');
  if(d.accManage){A.conns[d.accManage].confirm=false;return accOpenLayer({type:'manage',id:d.accManage})}
  if(d.accNotify){const x=ACC_INT.find(i=>i.id===d.accNotify);return toast(`Vorgemerkt: Wir sagen Bescheid, sobald ${x.n} verfügbar ist`)}
  if(d.accFilter){A.filter=d.accFilter;return accRender()}
  if(d.accSyncnow){const c=A.conns[d.accSyncnow];if(!c)return;c.syncing=true;accLayerRender();setTimeout(()=>{c.syncing=false;c.last='gerade eben';const add=12+Math.round(Math.random()*80);c.pts+=add;A.lastSync='gerade eben';accLayerRender();if(S.view==='connect')accRender();toast(`Synchronisiert · ${add} neue Datenpunkte`)},1200);return}
  if('accSyncall' in d){const ids=Object.keys(A.conns);if(!ids.length)return toast('Noch nichts verbunden');think(()=>{ids.forEach(id=>{A.conns[id].last='gerade eben';A.conns[id].pts+=5+Math.round(Math.random()*40)});A.lastSync='gerade eben';accRender();toast(`${ids.length} Verbindungen synchronisiert`)},1000);return}
  if(d.accType&&ACC_L&&ACC_L.type==='manage'){const c=A.conns[ACC_L.id];c.types[d.accType]=!c.types[d.accType];accLayerRender();return toast(`${d.accType}: ${c.types[d.accType]?'wird synchronisiert':'pausiert'}`)}
  if(d.accDisc&&ACC_L){const id=ACC_L.id,c=A.conns[id],x=ACC_INT.find(i=>i.id===id);
    if(d.accDisc==='ask'){c.confirm=true;accLayerRender();return accFocusSel('#accLayer [data-acc-disc="no"]')}
    if(d.accDisc==='no'){c.confirm=false;accLayerRender();return accFocusSel('#accLayer [data-acc-disc="ask"]')}
    delete A.conns[id];accCloseLayer(true);accRender();accPersistIf();return toast(`${x.n} getrennt · importierte Daten bleiben erhalten`)}

function grCore(lang,src){
 const c=GR_CORE[lang],t=src.t;
 if(lang==='de')return {...c,hook:t};
 if(lang==='en')return {...c,hook:GR_EN_T[POSTS.indexOf(src)]||t};
 return {...c,hook:c.h[POSTS.indexOf(src)]||c.h[0]};
}
function grBlocks(f,lang,src){
 const c=grCore(lang,src),rich=!!c.ptsL,en=lang==='en';
 const L=(de,e)=>en?e:de;
 switch(f){
  case 'clips':return [
   {l:'Clip 1 · 00:00–00:31',t:`Hook: „${c.hook}“\n${rich?L('Schwerpunkt: Problem. Endet mit Keyword-CTA.','Focus: the problem. Ends with keyword CTA.'):c.problem}`},
   {l:'Clip 2 · 00:12–00:41',t:`Hook: „${c.three}“\n${c.pts.map((p,i)=>`0${i+1} ${p}`).join('\n')}`},
   {l:'Clip 3 · 00:29–00:58',t:`Hook: „${c.proofHook}“\n${c.proof}`},
   {l:'Untertitel',t:rich?L('Eingebrannt, 2 Zeilen, Keywords in Orange · 9:16','Burned in, 2 lines, keywords in orange · 9:16'):'SRT + eingebrannt · 9:16'}];
  case 'carousel':return [{l:'Slide 1 · Cover',t:c.hook},{l:'Slide 2',t:c.problem},...c.pts.map((p,i)=>({l:`Slide ${i+3}`,t:`0${i+1} · ${rich?c.ptsL[i]:p}`})),{l:'Slide 6 · Beleg',t:c.proof},...(rich?[{l:'Slide 7',t:c.today}]:[]),{l:`Slide ${rich?8:7} · CTA`,t:c.cta}];
  case 'linkedin':return rich?[{t:`${c.hook}.\n\n${c.problem}\n\n${c.three}\n\n${c.ptsL.map((p,i)=>`${i+1}. ${p}`).join('\n')}\n\n${c.proof}\n\n${c.ctaLi}\n\n${c.hash}`}]:[{t:`${c.hook}\n\n${c.problem}\n\n${c.pts.map(p=>'→ '+p).join('\n')}\n\n${c.proof}\n\n${c.cta}`}];
  case 'short':return [{l:L('Titel','Title'),t:`${c.hook} #shorts`},{l:L('Schnitt','Cut'),t:'00:00–00:45 · 9:16 · Untertitel eingebrannt'},{l:L('Beschreibung','Description'),t:rich?c.ytDesc:c.problem}];
  case 'newsletter':return [{l:L('Betreff','Subject'),t:c.hook},{l:'Preheader',t:rich?c.nlPre:c.three},{l:'Intro',t:rich?`${c.nlHi}\n\n${c.nlIntro}`:`${c.problem}\n\n${c.proof}`}];
  case 'xthread':return [{l:'1/5',t:c.hook},{l:'2/5',t:c.problem},{l:'3/5',t:`${c.three}\n${c.pts.map(p=>'– '+p).join('\n')}`},{l:'4/5',t:c.proof},{l:'5/5',t:c.cta}];
  case 'story':return [{l:'Story 1 · Hook',t:c.hook},{l:'Story 2 · Problem',t:c.problem},{l:'Story 3 · Liste',t:c.pts.join(' · ')},{l:'Story 4 · Beweis',t:c.proofHook},{l:'Story 5 · CTA',t:c.cta}];
 }
 return [];
}

 const rows=GR_REP_ROWS.map(r=>[r[0],r[1],grSc(r[2]),grSc(r[3]),grSc(r[4]),grSc(r[5])]);
 const t=i=>rows.reduce((s,r)=>s+r[i],0);
 const leads=t(3),calls=t(4),clos=t(5),rev=clos*GR_DEAL;
 return {rows,leads,calls,clos,rev,views:grSc(118600),fol:grSc(612),prev:{views:grSc(98000),fol:grSc(561),leads:Math.round(leads/1.15),calls:Math.round(calls/1.143),rev:Math.max(1,Math.round(clos/1.2))*GR_DEAL}};
}

   ['Positionierung in 3 Sätzen','Talking Head','Story-Link','cal.com',18,6,2,1200],
   ['Lead-Generation Story-Sequenz','Story','Story-Antwort „JA“','cal.com',33,10,2,1200]
  ].map(r=>{const k=S.attr==='first'?[1.15,1.1,1.2]:S.attr==='last'?[.85,.9,.8]:[1,1,1];return [r[0],r[1],r[2],r[3],Math.max(1,Math.round(r[4]*sc*k[0])),Math.max(1,Math.round(r[5]*sc*k[1])),Math.max(0,Math.round(r[6]*sc*k[2])),r[7]]});
  const tot=rows.reduce((a,r)=>a+r[6]*r[7],0),mx=Math.max(...rows.map(r=>r[6]*r[7]))||1;
  const attr=`<section class="card"><div class="hd"><div><h3>Revenue Attribution · Umsatz pro Beitrag</h3><p class="muted" style="margin:4px 0 0;font-size:12.5px">Beitrag → Keyword/Link → Lead → Termin → Zahlung (Stripe). ${fmt(tot)} € im September zugeordnet.</p></div>
   <div class="chips" role="group" aria-label="Zuordnungsmodell">${[['first','Erster Kontakt'],['weighted','Gewichtet'],['last','Letzter Kontakt']].map(([k,l])=>`<button data-attr="${k}" aria-pressed="${S.attr===k}">${l}</button>`).join('')}</div></div>
   <div class="attr-chain">${['Beitrag','Keyword / Link','Lead','Termin · cal.com / Calendly','Zahlung · Stripe','€ pro Beitrag'].map((s,i)=>`<span class="attr-step${i===5?' on':''}">${s}</span>`).join('<span class="attr-arr" aria-hidden="true">→</span>')}</div>
   <div class="scroll"><table class="tbl"><thead><tr><th>Beitrag</th><th>Quelle</th><th>Termin über</th><th class="r">Leads</th><th class="r">Calls</th><th class="r">Kunden</th><th class="r">Umsatz</th><th style="width:22%"></th></tr></thead><tbody>
   ${rows.map(r=>`<tr><td><b style="font-weight:500">${r[0]}</b><div class="muted" style="font-size:12px">${r[1]}</div></td><td><span class="tag">${r[2]}</span></td><td class="muted">${r[3]}</td><td class="r num">${r[4]}</td><td class="r num">${r[5]}</td><td class="r num">${r[6]}</td><td class="r num"><b style="font-weight:500">${fmt(r[6]*r[7])} €</b></td><td><div class="attr-bar"><i style="width:${r[6]*r[7]/mx*100}%"></i></div></td></tr>`).join('')}
   </tbody></table></div>
   <div class="insight" style="margin-top:14px"><div class="ic">${I.bulb||''}</div><div><p><b>Ein Karussell bringt dir mehr Umsatz als drei Reels zusammen.</b> Die Fallstudie hat die höchste Call-Quote (34 %). Empfehlung: diese Woche eine zweite Fallstudie, Keyword „FALL“ wiederverwenden.</p><div class="src">Basis: ${rows.reduce((a,r)=>a+r[4],0)} zugeordnete Leads · Stripe-Zahlungen September · Modell: ${S.attr==='first'?'Erster Kontakt':S.attr==='last'?'Letzter Kontakt':'Gewichtet'}</div></div></div>
  </section>`;
  return base.replace('<section class="card"><div class="hd"><h3>Leads nach Beitrag',attr+'<section class="card"><div class="hd"><h3>Leads nach Beitrag');
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-attr]');if(t){S.attr=t.dataset.attr;render()}});

/* assistant: more data-backed answers with actions */
const _answer=answer;
answer=function(q){
  const l=q.toLowerCase(),act=(v,t)=>`<button class="btn" style="margin-top:10px" data-go="${v}">${t} →</button>`;
  if(l.includes('umsatz')||l.includes('geld')||l.includes('kunden bring'))return `Im September hat dein Content <b>${fmt(Math.round(17*1200*B().scale))} €</b> nachweisbar gebracht. Top-Beitrag: das Karussell „Fallstudie: 42 → 148 Closings“ (62 Leads, 21 Calls, 6 Kunden).<ul><li>Karussells: höchste Call-Quote (34 %)</li><li>Reels: meiste Leads, aber nur 29 % buchen</li><li>Story-Antworten „JA“: günstigster Weg zum Termin</li></ul><div class="src">Basis: Revenue Attribution · Stripe · cal.com · Modell Gewichtet</div>${act('biz','Revenue Attribution öffnen')}`;
  if(l.includes('dm')||l.includes('automation')||l.includes('keyword'))return `Dein Keyword „SYSTEM“ hat 41 Leads gebracht, die Antwortquote liegt bei 63 %. Vorschlag: Nach der ersten DM eine Qualifizierungsfrage zum Umsatz einbauen, dann landen nur passende Leads im Kalender.<div class="src">Basis: DM Autopilot, letzte 30 Tage</div>${act('autopilot','DM Autopilot öffnen')}`;
  if(l.includes('trend')||l.includes('nische')||l.includes('konkurrenz')||l.includes('wettbewerb'))return `In deiner Nische wachsen gerade <b>„Ich habe X getestet“-Hooks</b> und <b>Zahlen-Karussells</b>. Deine Watchtime liegt über dem Schnitt, deine Posting-Frequenz darunter.<div class="src">Basis: Trend-Radar · anonymisierte Benchmarks</div>${act('radar','Trend-Radar öffnen')}`;
  if(l.includes('übersetz')||l.includes('englisch')||l.includes('repurpose')||l.includes('wiederverw'))return `Dein Reel „Warum 1 Mio. Views keine Kunden bringen“ eignet sich am besten: Daraus werden 3 Clips, 1 Karussell, 1 LinkedIn-Post und ein Newsletter, auf Wunsch auch auf Englisch und Spanisch.<div class="src">Basis: Top Content · Completion 48 %</div>${act('repurpose','Repurpose starten')}`;
  if(l.includes('report')||l.includes('zusammenfass')||l.includes('woche lief'))return `KW 40 kurz: Views und Leads steigen, 6 Abschlüsse aus Content. Schwachstelle: nur 2 Karussells, obwohl sie am meisten Umsatz bringen.<div class="src">Basis: CEO Report KW 40</div>${act('report','Ganzen Report öffnen')}`;
  return _answer(q);
};
const _vAI=vAI;
VIEWS.ai=function(){return _vAI().replace(/<div class="sugg">[\s\S]*?<\/div>/,`<div class="sugg">${['Welcher Content bringt mir Umsatz?','Was soll ich diese Woche posten?','Wie laufen meine DM-Automationen?','Was ist gerade Trend in meiner Nische?','Fass meine Woche zusammen','Analysiere meine letzten 20 Reels'].map(s=>`<button data-ask="${esc(s)}">${s}</button>`).join('')}</div>`)};

/* settings: point to the new dedicated views */
VIEWS.set=function(){
  const p=(window.accPlan&&accPlan())||{n:'Agency'};
  return `<div class="ph"><div><h1>Einstellungen</h1><p>Workspace „Agentur Aid Muric“ · ${BRANDS.length} Brands</p></div></div>
  <div class="grid g3">
   <section class="card"><div class="hd"><h3>Verbindungen</h3><span class="tag good">${S.acc&&S.acc.conns?Object.keys(S.acc.conns).length:2} aktiv</span></div><p class="muted" style="margin:0 0 14px">Instagram, TikTok, YouTube, LinkedIn, cal.com, Calendly, Stripe und mehr.</p><button class="btn" data-go="connect">Verwalten →</button></section>
   <section class="card"><div class="hd"><h3>Abo & Credits</h3><span class="tag ink">${p.n}</span></div><p class="muted" style="margin:0 0 14px">${fmt(S.credits)} von ${fmt(creditLimit())} Credits übrig.</p><button class="btn" data-go="billing">Abo verwalten →</button></section>
   <section class="card"><div class="hd"><h3>Profil & Sicherheit</h3></div><p class="muted" style="margin:0 0 14px">Name, Sprache, 2-Faktor-Login, Benachrichtigungen.</p><button class="btn" data-go="account">Profil öffnen →</button></section>
  </div>
  <section class="card"><div class="hd"><h3>Team & Rollen</h3><button class="btn" data-toast="Einladung vorbereitet">${I.plus} Einladen</button></div>
   ${[['AM','Aid Muric','Owner · alle Brands'],['ED','Editor','Editor · 2 Brands'],['KL','Klient Immobilien','Client · nur Freigaben']].map(t=>`<div class="task" style="grid-template-columns:32px minmax(0,1fr) auto"><span class="av">${t[0]}</span><div class="tt"><b>${t[1]}</b></div><span class="tag">${t[2]}</span></div>`).join('')}</section>
  <section class="card"><div class="hd"><h3>Datenschutz</h3><span class="tag">EU-Hosting</span></div><p class="muted" style="margin:0">Daten liegen in Frankfurt. AV-Vertrag, Datenexport und Löschung jederzeit. Die KI wird nicht mit deinen Inhalten trainiert.</p></section>`;
};
setTimeout(()=>spend(0),0);

/* ---------- Swipe-Ordner: fremde Videos als Link + Analyse speichern, eigene Videos über offizielle API ---------- */
I.folder='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.4l2 2h8.6A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>';
NAV.splice(NAV.findIndex(n=>n.k==='lib')+1,0,{k:'swipe',l:'Swipe-Ordner',i:'folder'});
INDEX.push({g:'Bereiche',t:'Swipe-Ordner',v:'swipe'});
S.sw={tab:'saved',folder:'Alle',open:null,err:'',items:[
 {id:1,url:'https://www.instagram.com/reel/C9xQ2example/',pf:'Instagram',who:'@coach.beispiel',folder:'Hooks',note:'Hook: „Ich habe 30 Tage lang …“ – starkes Selbstexperiment',an:{hook:'Selbstexperiment',struct:['Hook mit Zeitraum','Erwartung vs. Realität','3 Learnings','CTA: Kommentar-Keyword'],len:'38 Sek.',why:'Konkreter Zeitraum macht das Ergebnis glaubwürdig, die Spannung hält bis zum dritten Learning.'}},
 {id:2,url:'https://www.tiktok.com/@founder.beispiel/video/7400000000000000000',pf:'TikTok',who:'@founder.beispiel',folder:'Storytelling',note:'Founder-Story mit Tiefpunkt in Sek. 4',an:null},
 {id:3,url:'https://www.instagram.com/p/C8kL1example/',pf:'Instagram',who:'@agentur.beispiel',folder:'Karussells',note:'Vorher/Nachher-Karussell, 7 Slides',an:{hook:'Vorher / Nachher',struct:['Ergebnis-Slide zuerst','Ausgangslage','3 Schritte','Beweis-Screenshot','CTA Speichern'],len:'7 Slides',why:'Das Ergebnis steht auf Slide 1, deshalb wird weitergewischt statt weitergescrollt.'}},
 {id:4,url:'https://www.youtube.com/shorts/abcExample1',pf:'YouTube',who:'@creator.beispiel',folder:'Hooks',note:'',an:null}
]};
const SW_FOLDERS=['Alle','Hooks','Storytelling','Karussells','Ads','Stories'];
function swPf(u){try{const h=new URL(u).hostname.replace('www.','');if(h.endsWith('instagram.com'))return 'Instagram';if(h.endsWith('tiktok.com'))return 'TikTok';if(h.endsWith('youtube.com')||h==='youtu.be')return 'YouTube';if(h.endsWith('linkedin.com'))return 'LinkedIn';return null}catch(e){return null}}
function swWho(u){const m=u.match(/tiktok\.com\/(@[\w.]+)/);return m?m[1]:'Account wird beim Abruf ergänzt'}
function swCard(x){
  const an=x.an?`<div class="sw-an"><div class="sw-row"><span class="muted">Hook</span><b>${esc(x.an.hook)}</b></div><div class="sw-row"><span class="muted">Länge</span><b>${esc(x.an.len)}</b></div><ol class="sw-struct">${x.an.struct.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="sw-why">${esc(x.an.why)}</p><div class="src">Basis: Caption, Vorschaubild und deine Notiz</div></div>`
   :`<button class="btn" data-sw-an="${x.id}">${I.spark||''} Struktur analysieren · 2 Credits</button>`;
  return `<article class="card sw-card"><div class="sw-top"><span class="sw-pf">${x.pf[0]}</span><div style="min-width:0"><b style="font-weight:500">${esc(x.who)}</b><div class="muted" style="font-size:12px">${x.pf} · ${esc(x.folder)}</div></div><a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">Original ↗</a></div>
  ${x.note?`<p style="margin:0" class="fg2">${esc(x.note)}</p>`:''}${an}
  <div class="sw-act">${x.an?`<button class="btn pri" data-sw-script="${x.id}">Skript in meiner Stimme · 3 Credits</button>`:''}<button class="btn" data-sw-del="${x.id}">Entfernen</button></div></article>`;
}
VIEWS.swipe=function(){
  const W=S.sw,tabs=[['saved','Gespeichert'],['own','Eigene Videos']];
  let body='';
  if(W.tab==='saved'){
    const list=W.items.filter(x=>W.folder==='Alle'||x.folder===W.folder);
    body=`<section class="card"><form id="swForm" class="sw-form"><div class="fld" style="flex:2;min-width:220px"><label for="swUrl">Link zu Reel, TikTok, Short oder Post</label><input class="inp" id="swUrl" placeholder="https://www.instagram.com/reel/…" autocomplete="off"></div>
     <div class="fld" style="flex:1;min-width:150px"><label for="swFolder">Ordner</label><select class="inp" id="swFolder">${SW_FOLDERS.slice(1).map(f=>`<option>${f}</option>`).join('')}</select></div>
     <div class="fld" style="flex:2;min-width:220px"><label for="swNote">Notiz (optional)</label><input class="inp" id="swNote" placeholder="Was ist dir aufgefallen?" autocomplete="off"></div>
     <button class="btn pri" type="submit" style="align-self:flex-end">${I.plus} Speichern</button></form>
     ${W.err?`<p class="sw-err">${esc(W.err)}</p>`:''}
     <p class="muted" style="margin:12px 0 0;font-size:12.5px">Gespeichert werden Link, Vorschau und Analyse, nicht die Videodatei. Fremde Inhalte bleiben beim Urheber, das schützt dich vor Urheberrechts- und Plattformproblemen.</p></section>
     <div class="chips" style="align-self:flex-start">${SW_FOLDERS.map(f=>`<button data-sw-folder="${f}" aria-pressed="${W.folder===f}">${f} <span class="muted">${f==='Alle'?W.items.length:W.items.filter(x=>x.folder===f).length}</span></button>`).join('')}</div>
     ${list.length?`<div class="sw-grid">${list.map(swCard).join('')}</div>`:`<div class="empty">Noch nichts in „${esc(W.folder)}“. Füge oben einen Link ein.</div>`}`;
  }else{
    body=`<section class="card"><div class="hd"><h3>Deine eigenen Videos</h3><span class="tag good">über offizielle API</span></div>
     <p class="muted" style="margin:0 0 12px">Deine Originaldateien, ohne Plattform-Wasserzeichen, direkt aus deinen verbundenen Konten. Ideal zum Neu-Schneiden und Repurposen.</p>
     <div class="scroll"><table class="tbl"><thead><tr><th>Beitrag</th><th>Plattform</th><th class="r">Views</th><th></th></tr></thead><tbody>
     ${POSTS.slice(0,6).map(p=>`<tr><td>${esc(p.t)}</td><td class="muted">${esc(p.p)}</td><td class="r num">${fmt(p.v||0)}</td><td class="r"><button class="btn" data-toast="Original wird über die API geladen (in der Demo deaktiviert)">Original laden</button> <button class="btn" data-go="repurpose">Repurpose</button></td></tr>`).join('')}
     </tbody></table></div></section>
     <section class="card"><div class="hd"><h3>Eigene Datei hochladen</h3></div><p class="muted" style="margin:0 0 12px">Video hochladen: Transkript, Hook-Analyse und Clip-Vorschläge entstehen automatisch.</p><label class="btn" for="swUp" style="cursor:pointer">${I.plus} Video wählen</label><input type="file" id="swUp" accept="video/*" hidden></section>`;
  }
  return `<div class="ph"><div><h1>Swipe-Ordner</h1><p>Videos, die dich inspirieren, als Link speichern, analysieren und in deiner Stimme neu umsetzen.</p></div><div class="chips">${tabs.map(([k,l])=>`<button data-sw-tab="${k}" aria-pressed="${W.tab===k}">${l}</button>`).join('')}</div></div>${body}`;
};
document.addEventListener('submit',e=>{if(e.target.id!=='swForm')return;e.preventDefault();const u=document.getElementById('swUrl').value.trim(),pf=swPf(u);
  if(!pf){S.sw.err='Bitte einen Link von Instagram, TikTok, YouTube oder LinkedIn einfügen.';return render()}
  S.sw.err='';S.sw.items.unshift({id:Date.now(),url:u,pf,who:swWho(u),folder:document.getElementById('swFolder').value,note:document.getElementById('swNote').value.trim(),an:null});render();toast('Im Swipe-Ordner gespeichert')});
document.addEventListener('change',e=>{if(e.target.id==='swUp'&&e.target.files.length)toast('Video hochgeladen · Transkript wird erstellt …')});
document.addEventListener('click',e=>{const t=e.target.closest('[data-sw-tab],[data-sw-folder],[data-sw-an],[data-sw-script],[data-sw-del]');if(!t)return;const d=t.dataset,W=S.sw;
  if(d.swTab){W.tab=d.swTab;return render()}
  if(d.swFolder){W.folder=d.swFolder;return render()}
  const x=W.items.find(i=>i.id===+(d.swAn||d.swScript||d.swDel));if(!x)return;
  if(d.swDel){W.items=W.items.filter(i=>i!==x);render();return toast('Entfernt')}
  if(d.swAn)return think(()=>{x.an={hook:x.pf==='TikTok'?'Tiefpunkt-Story':'Zahl im ersten Satz',struct:['Hook in 2 Sek.','Kontext','Wendepunkt','Learning','CTA'],len:x.pf==='YouTube'?'45 Sek.':'32 Sek.',why:'Der Wendepunkt kommt vor der Hälfte, dadurch bleibt die Watchtime hoch.'};spend(2,'Struktur analysiert');render()});
  if(d.swScript)return think(()=>{S.cards=S.cards||CARDS0.map(c=>({...c}));S.cards.push({id:Date.now(),t:'Neu umgesetzt: '+x.an.hook,c:'Skript',p:'IG',who:'AM'});spend(3,'Skript in deiner Stimme in die Pipeline gelegt');render()});
});

/* boot */
try{const th=localStorage.getItem('bos-theme');if(th)document.documentElement.dataset.theme=th;const v=localStorage.getItem('bos-view');if(v&&VIEWS[v])S.view=v}catch(e){}
const h=location.hash.replace('#','');if(VIEWS[h])S.view=h;
render();
</script>
